x("22","R",550,'mcq',"Zara notices a metal teaspoon gets hot in tea but a plastic one does not. She plans a fair test. What should she change and what should she keep the same?|تلاحظ زارا أن ملعقة المعدن تسخن في الشاي أما البلاستيك فلا. تخطط لاختبار عادل. ماذا تغيّر وماذا تُبقي ثابتًا؟","Changes more than one thing in a test|يغيّر أكثر من شيء في الاختبار",{o:sp("Change only the type of spoon and keep the amount and temperature of the hot water the same;Change the spoon and the water temperature;Change the amount of water only;Change nothing|تغيّر نوع الملعقة فقط وتُبقي كمية الماء الساخن ودرجة حرارته ثابتتين;تغيّر الملعقة ودرجة حرارة الماء;تغيّر كمية الماء فقط;لا تغيّر شيئًا"),ex:["In a fair test we change one thing (the material of the spoon) and keep everything else the same, such as the hot water and the time. Then we know the material caused the result.", "Fair test = change one thing only.", "في الاختبار العادل نغيّر شيئًا واحدًا (مادة الملعقة) ونُبقي كل شيء آخر ثابتًا كالماء الساخن والزمن. عندها نعرف أن المادة هي سبب النتيجة.", "اختبار عادل = تغيير شيء واحد فقط."]});
x("23","K",400,'mcq',"Which statement about energy is true?|أي عبارة عن الطاقة صحيحة؟","Thinks energy can be used up|يظن أن الطاقة يمكن أن تُستهلك",{o:sp("Energy cannot be made or destroyed;Energy is used up when we use it;Energy can be made from nothing;Energy disappears when it gets cold|الطاقة لا تُصنع ولا تُدمَّر;الطاقة تُستهلك عندما نستخدمها;الطاقة تُصنع من لا شيء;الطاقة تختفي عندما تبرد"),ex:["Energy can only be transferred and change form. We cannot make energy or destroy it.", "Energy: moves and changes form, never made or destroyed.", "الطاقة لا تفعل سوى أن تنتقل وتتغير من شكل إلى آخر. ولا يمكننا صنعها أو تدميرها.", "الطاقة تنتقل وتتغير ولا تُصنع ولا تُدمَّر."]});
x("23","A",475,'mcq',"A fan is switched on. Which energy change happens in the fan?|شُغّلت مروحة. أي تغيّر في الطاقة يحدث فيها؟","Reverses the energy change|يعكس تغيّر الطاقة",{o:sp("Electrical energy changes to movement energy;Movement energy changes to electrical energy;Light energy changes to heat;Sound changes to light|الطاقة الكهربائية تتحول إلى طاقة حركة;طاقة الحركة تتحول إلى كهربائية;الضوء يتحول إلى حرارة;الصوت يتحول إلى ضوء"),ex:["A fan needs electrical energy to work. It changes electrical energy into movement energy. Some of the movement energy also changes into sound energy, which goes into the surroundings.", "Fan: electrical → movement (+ some sound).", "تحتاج المروحة إلى طاقة كهربائية لتعمل، فتحوّل الطاقة الكهربائية إلى طاقة حركة. وبعض طاقة الحركة يتحول إلى صوت ينتقل إلى المحيط.", "مروحة: كهربائية ← حركة (+ بعض الصوت)."]});
x("23","A",475,'mcq',"When a drum is hit, the drum skin moves and the drum makes a sound. What energy change happens?|عند ضرب الطبل يتحرك جلده ويصدر صوتًا. ما تغيّر الطاقة؟","Cannot name the energy change|لا يستطيع تسمية تغيّر الطاقة",{o:sp("Movement energy changes to sound energy;Sound energy changes to movement energy;Heat energy changes to light energy;Light energy changes to movement energy|طاقة الحركة تتحول إلى طاقة صوت;طاقة الصوت تتحول إلى حركة;الحرارة تتحول إلى ضوء;الضوء يتحول إلى حركة"),ex:["The movement energy from our hand moves to the drum. The drum skin moves, and the movement energy changes to sound energy.", "Hit a drum: movement → sound.", "تنتقل طاقة الحركة من يدنا إلى الطبل فيتحرك جلده وتتحول طاقة الحركة إلى طاقة صوت.", "ضرب الطبل: حركة ← صوت."]});
x("23","R",550,'mcq',"Omar says: \"My cup of tea is cold now, so the heat energy was used up.\" Is he right?|يقول عمر: «كوب الشاي بارد الآن فقد استُهلكت الطاقة الحرارية». هل هو على صواب؟","Thinks energy is used up when we cannot observe it|يظن أن الطاقة تُستهلك عندما لا نلاحظها",{o:sp("No, the heat energy moved from the tea and cup to the surroundings;Yes, energy is always used up;Yes, but only for tea;No, the tea made more energy|لا، انتقلت الطاقة الحرارية من الشاي والكوب إلى المحيط;نعم الطاقة تُستهلك دائمًا;نعم لكن للشاي فقط;لا، الشاي صنع طاقة أكثر"),ex:["Sometimes it seems that energy is used up, but it is not. The heat energy in the tea moves into the surrounding environment. We cannot destroy energy.", "It seems used up, but it moved to the surroundings.", "أحيانًا يبدو أن الطاقة استُهلكت لكنها لم تُستهلك. انتقلت الطاقة الحرارية في الشاي إلى المحيط. ولا يمكننا تدمير الطاقة.", "تبدو مستهلكة لكنها انتقلت إلى المحيط."]});
x("24","K",400,'mcq',"Which living things can make their own food using energy from the Sun?|أي الكائنات الحية تصنع غذاءها بنفسها باستخدام طاقة الشمس؟","Thinks animals make their own food|يظن أن الحيوانات تصنع غذاءها",{o:sp("Plants;Animals;Humans;Fish|النباتات;الحيوانات;البشر;الأسماك"),ex:["Plants use light energy from the Sun to make their own food, so they are called producers. Animals and humans cannot make food, so they must eat.", "Plants = producers.", "تستخدم النباتات طاقة الضوء من الشمس لتصنع غذاءها فتسمى منتجات. أما الحيوانات والبشر فلا يصنعون غذاءهم لذلك يأكلون.", "النباتات = منتجات."]});
x("24","K",475,'mcq',"Zebras and snails eat only plants. What are they called?|تأكل الحمر الوحشية والحلزونات النباتات فقط. ماذا تسمى؟","Mixes up herbivore, carnivore and omnivore|يخلط بين آكل الأعشاب واللحوم وكل شيء",{o:sp("Herbivores;Carnivores;Omnivores;Producers|آكلات أعشاب;آكلات لحوم;آكلات كل شيء;منتجات"),ex:["Herbivores eat only plants. Carnivores eat other animals, and omnivores eat both plants and animals. All of them are consumers.", "Herbivore = plants. Carnivore = animals. Omnivore = both.", "آكلات الأعشاب تأكل النباتات فقط، وآكلات اللحوم تأكل حيوانات أخرى، وآكلات كل شيء تأكل النباتات والحيوانات. وكلها مستهلكات.", "آكل أعشاب = نباتات. آكل لحوم = حيوانات. آكل كل شيء = كلاهما."]});
x("24","R",550,'mcq',"A farmer removes all the grass from a field. Predict what will happen to the grasshoppers and the frogs that eat them, and why.|أزال مزارع كل العشب من حقل. توقّع ماذا سيحدث للجنادب والضفادع التي تأكلها ولماذا.","Does not see that the food chain depends on the producer|لا يرى أن السلسلة تعتمد على المنتج",{o:sp("Both will decrease, because the food chain starts with the producer and the energy runs out;Both will increase;Only frogs will decrease;Nothing will change|سيقل عددهما لأن السلسلة الغذائية تبدأ بالمنتج وتنقطع الطاقة;سيزداد عددهما;الضفادع فقط ستقل;لن يتغير شيء"),ex:["In the food chain grass → grasshopper → frog, energy is transferred from the producer to the consumers. If the grass is gone, grasshoppers have no food, and then the frogs also have less to eat.", "No producer = no energy for the whole chain.", "في السلسلة عشب ← جندب ← ضفدع تنتقل الطاقة من المنتج إلى المستهلكات. فإذا اختفى العشب لا يجد الجندب غذاءً ثم يقل غذاء الضفدع أيضًا.", "لا منتج = لا طاقة للسلسلة كلها."]});
x("24","R",625,'mcq',"Why can a food chain never begin with an animal?|لماذا لا يمكن أن تبدأ السلسلة الغذائية بحيوان؟","Does not know the order producer → consumer|لا يعرف الترتيب منتج ← مستهلك",{o:sp("Because animals cannot make food, so it must start with a plant that makes food from the Sun's energy;Because animals are too small;Because animals do not need energy;Because plants eat animals|لأن الحيوانات لا تصنع الغذاء فتبدأ السلسلة بنبات يصنع الغذاء من طاقة الشمس;لأن الحيوانات صغيرة جدًا;لأن الحيوانات لا تحتاج طاقة;لأن النباتات تأكل الحيوانات"),ex:["Food chains always contain a producer and at least one consumer. The order is always producer → consumer. Only plants can make their own food.", "Order: producer → consumer.", "تحتوي السلاسل الغذائية دائمًا على منتج ومستهلك واحد على الأقل، والترتيب دائمًا منتج ← مستهلك. والنباتات وحدها تصنع غذاءها.", "الترتيب: منتج ← مستهلك."]});
x("31","K",400,'mcq',"What is matter?|ما المادة؟","Thinks matter is only solid things|يظن أن المادة هي الأجسام الصلبة فقط",{o:sp("Everything around us;Only solids;Only living things;Only things we can see|كل ما حولنا;المواد الصلبة فقط;الكائنات الحية فقط;ما نراه فقط"),ex:["Matter is everything around us. All matter is made of particles, and it can be a solid, a liquid or a gas.", "Matter = everything around us.", "المادة هي كل ما حولنا. وكل المادة تتكوّن من جسيمات وقد تكون صلبة أو سائلة أو غازية.", "المادة = كل ما حولنا."]});
x("31","A",475,'mcq',"Which of these is a substance and NOT a mixture?|أي مما يلي مادة نقية وليس مخلوطًا؟","Confuses substances with materials|يخلط بين المواد النقية والخامات",{o:sp("Pure water;Glass;Concrete;Wood|الماء النقي;الزجاج;الخرسانة;الخشب"),ex:["A substance is a pure type of solid, liquid or gas. Pure water is a substance. Glass and concrete are materials made by mixing different substances.", "Substance = pure. Most materials = mixtures.", "المادة النقية نوع خالص من الصلب أو السائل أو الغاز. الماء النقي مادة نقية. أما الزجاج والخرسانة فهما خامات تصنع من خلط مواد مختلفة.", "مادة نقية = خالصة. معظم الخامات = مخاليط."]});
x("31","R",550,'mcq',"A drop of food dye is dropped into still water. After a while all the water is coloured, even though nobody stirred it. What explains this?|وُضعت قطرة صبغة غذائية في ماء ساكن. بعد قليل تلوّن الماء كله دون تحريك. ما التفسير؟","Thinks particles in liquids do not move|يظن أن جسيمات السوائل لا تتحرك",{o:sp("The particles of the liquid are always moving and spread the dye;The dye is heavier than water;The water is a solid;Particles in liquids never move|جسيمات السائل تتحرك دائمًا وتنشر الصبغة;الصبغة أثقل من الماء;الماء صلب;جسيمات السوائل لا تتحرك أبدًا"),ex:["Particles are always moving, even when we cannot see them. In a liquid they slide past each other, so the dye particles mix with the water particles.", "Particles move all the time.", "الجسيمات تتحرك دائمًا حتى لو لم نرها. وفي السائل تنزلق بعضها فوق بعض فتختلط جسيمات الصبغة بجسيمات الماء.", "الجسيمات تتحرك طوال الوقت."]});
x("32","K",400,'mcq',"In a solid, how are the particles arranged?|كيف تترتب الجسيمات في المادة الصلبة؟","Thinks solid particles do not move at all|يظن أن جسيمات الصلب لا تتحرك إطلاقًا",{o:sp("Packed tightly together in a regular pattern;Far apart and moving freely;Sliding past each other;Not moving at all|متراصة بإحكام في نمط منتظم;متباعدة وتتحرك بحرية;تنزلق بعضها فوق بعض;لا تتحرك إطلاقًا"),ex:["In a solid, the particles are packed tightly in a regular pattern with very small spaces between them. They cannot move around very much, so a solid keeps its shape.", "Solid: tight, regular, fixed position.", "في المادة الصلبة تكون الجسيمات متراصة بإحكام في نمط منتظم وبينها مسافات صغيرة جدًا. لا تستطيع الحركة كثيرًا لذلك يحتفظ الصلب بشكله.", "صلب: متراص ومنتظم وثابت المكان."]});
x("32","A",475,'mcq',"Why does water take the shape of its container?|لماذا يأخذ الماء شكل إنائه؟","Cannot use the particle model for liquids|لا يستخدم نموذج الجسيمات للسوائل",{o:sp("Its particles can slide past each other and change places;Its particles are fixed in place;It has no particles;Its particles are packed in a regular pattern|جسيماته تنزلق بعضها فوق بعض وتغيّر أماكنها;جسيماته ثابتة;ليس له جسيمات;جسيماته مرتبة بنمط منتظم"),ex:["In a liquid the particles are close together but not in a regular pattern. They slide past one another, so the liquid can flow and take the shape of its container.", "Liquid particles slide → liquid flows.", "في السائل تكون الجسيمات قريبة لكنها ليست في نمط منتظم. تنزلق بعضها فوق بعض فيجري السائل ويأخذ شكل إنائه.", "جسيمات السائل تنزلق ← السائل يجري."]});
x("32","A",475,'mcq',"Sand is a solid but we can pour it like a liquid. Why?|الرمل مادة صلبة لكن يمكننا صبّه كالسائل. لماذا؟","Thinks any substance that pours is a liquid|يظن أن كل ما يُصبّ سائل",{o:sp("It is made of tiny grains with air between them, so the grains can flow past one another;Sand is really a liquid;Sand has no particles;Sand is a gas|يتكوّن من حبيبات صغيرة بينها هواء فتتحرك الحبيبات بعضها فوق بعض;الرمل في الحقيقة سائل;الرمل بلا جسيمات;الرمل غاز"),ex:["Powders like sand, flour and sugar are made of tiny grains. There is air between the grains, so they can flow past one another. Each grain is still a solid made of millions of particles.", "Powders are solids whose grains can flow.", "المساحيق مثل الرمل والدقيق والسكر تتكوّن من حبيبات صغيرة بينها هواء فتتحرك الحبيبات بعضها فوق بعض. وكل حبيبة تبقى مادة صلبة من ملايين الجسيمات.", "المساحيق مواد صلبة وحباتها تنساب."]});
x("32","R",550,'mcq',"Group A times salt flowing through a funnel: 12 s, 12 s, 13 s. Group B: 8 s, 20 s, 14 s. Whose results are more reliable?|سجلت المجموعة A زمن انسياب الملح عبر القمع: ١٢ ث، ١٢ ث، ١٣ ث. والمجموعة B: ٨ ث، ٢٠ ث، ١٤ ث. أي نتائج أوثق؟","Does not know what reliable results are|لا يعرف ما النتائج الموثوقة",{o:sp("Group A, because repeating the test gave similar answers;Group B, because the numbers are different;Group B, because it has the smallest time;Neither can be reliable|المجموعة A لأن تكرار الاختبار أعطى إجابات متقاربة;المجموعة B لأن أرقامها مختلفة;المجموعة B لأن لديها أصغر زمن;لا يمكن لأي منهما أن تكون موثوقة"),ex:["Results are reliable if we get the same or similar answer each time we repeat a test. Group A's three times are very close, so they are more reliable.", "Reliable = similar results when repeated.", "تكون النتائج موثوقة إذا حصلنا على إجابة متماثلة أو متقاربة كل مرة نكرر فيها الاختبار. أزمنة المجموعة A الثلاثة متقاربة جدًا فهي أوثق.", "موثوق = نتائج متقاربة عند التكرار."]});
x("33","K",400,'mcq',"What is the change of state from solid to liquid called?|ما اسم تغيّر الحالة من صلب إلى سائل؟","Mixes up melting and solidifying|يخلط بين الانصهار والتجمّد",{o:sp("Melting;Solidifying;Burning;Rusting|الانصهار;التجمّد;الاحتراق;الصدأ"),ex:["Melting is the change from solid to liquid when a substance is heated. Solidifying is the opposite: liquid to solid when it loses heat. Solidifying is sometimes called freezing.", "Heat → melt. Cool → solidify.", "الانصهار هو التحول من صلب إلى سائل عند التسخين. والتجمّد عكسه: من سائل إلى صلب عند فقد الحرارة، ويسمى أحيانًا التجمّد بالتبريد.", "تسخين ← انصهار. تبريد ← تجمّد."]});
x("33","K",475,'mcq',"A liquid changes to a solid when it loses heat. What is this change called?|يتحول سائل إلى صلب عندما يفقد الحرارة. ما اسم هذا التغيّر؟","Thinks cooling makes solids melt|يظن أن التبريد يجعل الصلب ينصهر",{o:sp("Solidifying;Melting;Reacting;Spinning|التجمّد;الانصهار;التفاعل;الدوران"),ex:["When a liquid cools it loses heat energy, its particles slow down and move closer together, and it becomes a solid. This is solidifying (freezing).", "Cooling → solidifying.", "عندما يبرد السائل يفقد طاقة حرارية فتبطئ جسيماته وتقترب من بعضها فيصبح صلبًا. وهذا هو التجمّد.", "تبريد ← تجمّد."]});
x("33","A",475,'mcq',"A chocolate bar left in the Sun turns into a liquid. What happens to its particles?|تتحول قطعة شوكولاتة تُركت في الشمس إلى سائل. ماذا يحدث لجسيماتها؟","Cannot use the particle model to explain melting|لا يستخدم نموذج الجسيمات لتفسير الانصهار",{o:sp("They gain energy, move faster and move further apart;They stop moving;They disappear;They move closer together|تكتسب طاقة وتتحرك أسرع وتبتعد عن بعضها;تتوقف عن الحركة;تختفي;تقترب من بعضها"),ex:["Heat energy changes into movement energy of the particles. With enough energy they move so fast that they move apart, and the solid melts into a liquid.", "Heat → particles move faster and further apart → melting.", "تتحول الطاقة الحرارية إلى طاقة حركة للجسيمات. ومع طاقة كافية تتحرك بسرعة وتبتعد فينصهر الصلب ويصبح سائلًا.", "حرارة ← جسيمات أسرع وأبعد ← انصهار."]});
x("33","R",625,'mcq',"Melted gold is poured into a mould and left to cool. Predict what will happen and explain using particles.|يُصبّ ذهب منصهر في قالب ويُترك ليبرد. توقّع ماذا سيحدث وفسّر بالجسيمات.","Thinks a cooled liquid becomes a new substance|يظن أن السائل المبرّد يصبح مادة جديدة",{o:sp("It becomes solid gold because its particles lose energy, slow down and move closer together;It stays liquid for ever;It turns into a new substance;It disappears|يصبح ذهبًا صلبًا لأن جسيماته تفقد الطاقة وتبطئ وتقترب من بعضها;يبقى سائلًا للأبد;يتحول إلى مادة جديدة;يختفي"),ex:["Metals melt only at very high temperatures. When melted metal cools it solidifies and becomes a solid again. It is still gold, so this is a physical change.", "Cool liquid metal → solid. Same substance.", "تنصهر الفلزات عند درجات حرارة عالية جدًا. وعندما يبرد الفلز المنصهر يتجمد ويصبح صلبًا مرة أخرى. وهو ما زال ذهبًا لذلك هذا تغيّر فيزيائي.", "فلز سائل يبرد ← صلب. المادة نفسها."]});
x("34","K",400,'mcq',"What forms in a chemical reaction?|ماذا يتكوّن في التفاعل الكيميائي؟","Thinks no new substance forms|يظن أن مادة جديدة لا تتكوّن",{o:sp("A new substance;The same substance;Only a solid;Nothing|مادة جديدة;المادة نفسها;مادة صلبة فقط;لا شيء"),ex:["In a chemical reaction, substances react together to form a new substance. For most chemical reactions we cannot change the new substance back.", "Chemical reaction = new substance.", "في التفاعل الكيميائي تتفاعل المواد معًا فتتكوّن مادة جديدة. وفي معظم التفاعلات لا يمكن إعادة المادة الجديدة إلى ما كانت عليه.", "تفاعل كيميائي = مادة جديدة."]});
x("34","K",475,'mcq',"Which of these is a chemical reaction?|أي مما يلي تفاعل كيميائي؟","Thinks melting is a chemical reaction|يظن أن الانصهار تفاعل كيميائي",{o:sp("Wood burning;Ice melting;Water freezing;Butter melting|احتراق الخشب;انصهار الثلج;تجمّد الماء;انصهار الزبدة"),ex:["When wood burns it reacts with air and forms ash and gases, which are new substances. Melting and freezing are physical changes because the substance stays the same.", "Burning and rusting = chemical. Melting and freezing = physical.", "عندما يحترق الخشب يتفاعل مع الهواء فيتكوّن رماد وغازات وهي مواد جديدة. أما الانصهار والتجمّد فتغيّران فيزيائيان لأن المادة تبقى نفسها.", "احتراق وصدأ = كيميائي. انصهار وتجمّد = فيزيائي."]});
x("34","A",475,'mcq',"After three days, a metal nail in a saucer of water is covered in a reddish-brown substance. What is it and how did it form?|بعد ثلاثة أيام غطّت مادة بنية محمرة مسمارًا معدنيًا في طبق ماء. ما هي وكيف تكوّنت؟","Does not recognise rusting as a reaction|لا يعرف أن الصدأ تفاعل كيميائي",{o:sp("Rust, formed in a chemical reaction of the metal with water and air;Ash, formed by melting;Ice, formed by cooling;Dust, formed by evaporation|صدأ تكوّن بتفاعل كيميائي بين الفلز والماء والهواء;رماد تكوّن بالانصهار;جليد تكوّن بالتبريد;غبار تكوّن بالتبخر"),ex:["Rust is a new substance. It forms when iron reacts with water and air. Rusting is a chemical reaction and it makes cars, bridges and buildings weak.", "Rusting = iron + water + air → rust.", "الصدأ مادة جديدة تتكوّن عندما يتفاعل الحديد مع الماء والهواء. الصدأ تفاعل كيميائي ويُضعف السيارات والجسور والمباني.", "الصدأ = حديد + ماء + هواء ← صدأ."]});
x("34","R",550,'mcq',"Wire wool rusts in a jar with water and air but not when it is kept dry. What conclusion fits?|يصدأ الصوف المعدني في وعاء فيه ماء وهواء ولا يصدأ إذا بقي جافًا. أي استنتاج يناسب؟","Cannot draw a conclusion from results|لا يستنتج من النتائج",{o:sp("Rusting needs water as well as air;Rusting needs only dry air;Water stops rusting;Rusting is a change of state|الصدأ يحتاج الماء إضافة إلى الهواء;الصدأ يحتاج هواءً جافًا فقط;الماء يمنع الصدأ;الصدأ تغيّر في الحالة"),ex:["The only difference was water, and the wet wire wool rusted while the dry wire wool did not. So water is needed for rusting. Observing over time helps us see this change.", "The thing that differs explains the result.", "الفرق الوحيد كان الماء، فصدأ الصوف المبلل ولم يصدأ الجاف. إذن الماء ضروري للصدأ. والملاحظة عبر الزمن تساعدنا على رؤية هذا التغيّر.", "الشيء المختلف يفسر النتيجة."]});
x("34","R",625,'mcq',"Builders mix cement powder, sand, water and limestone to make concrete. Why can the concrete NOT be changed back into these materials?|يخلط البنّاؤون الإسمنت والرمل والماء والحجر الجيري لصنع الخرسانة. لماذا لا يمكن إعادة الخرسانة إلى هذه المواد؟","Thinks all changes can be reversed|يظن أن كل التغيّرات تُعكس",{o:sp("A chemical reaction made a new substance, and most chemical reactions cannot be reversed;It is a change of state;The materials melted;Concrete is a mixture of liquids|تفاعل كيميائي كوّن مادة جديدة ومعظم التفاعلات الكيميائية لا تُعكس;إنه تغيّر في الحالة;المواد انصهرت;الخرسانة مخلوط سوائل"),ex:["Concrete forms in a chemical reaction. The new substance is different from the substances that made it, and it is not possible to turn it back. A change of state, such as melting, can be reversed.", "Chemical reaction: usually cannot be reversed.", "تتكوّن الخرسانة بتفاعل كيميائي. والمادة الجديدة تختلف عن المواد التي صنعتها ولا يمكن إعادتها. أما تغيّر الحالة مثل الانصهار فيمكن عكسه.", "التفاعل الكيميائي غالبًا لا يُعكس."]});
x("41","K",475,'mcq',"Which layer of the Earth is made of the metals iron and nickel?|أي طبقات الأرض مكوّنة من الحديد والنيكل؟","Thinks the mantle is made of metals|يظن أن الستار مكوّن من فلزات",{o:sp("The core;The crust;The mantle;The atmosphere|اللب;القشرة;الستار;الغلاف الجوي"),ex:["The Earth has three main layers: the thin crust of rock, the mantle of hot, melted rock called magma, and the core made of iron and nickel. The outer core is liquid and the inner core is solid.", "Crust (rock) → mantle (magma) → core (iron + nickel).", "للأرض ثلاث طبقات رئيسة: القشرة الصخرية الرقيقة، والستار من صخور ساخنة منصهرة تسمى الصهارة، واللب المكوّن من الحديد والنيكل. اللب الخارجي سائل والداخلي صلب.", "قشرة (صخر) ← ستار (صهارة) ← لب (حديد ونيكل)."]});
x("41","R",625,'mcq',"For a long time scientists thought the inner core was 5000 °C. In 2014 new equipment showed it is about 6000 °C. What does this show?|ظن العلماء زمنًا طويلًا أن اللب الداخلي ٥٠٠٠°م. وفي ٢٠١٤ أظهرت معدات جديدة أنه نحو ٦٠٠٠°م. ماذا يدل ذلك؟","Thinks scientific ideas never change|يظن أن الأفكار العلمية لا تتغير",{o:sp("Scientific knowledge can change when scientists find new evidence;Scientists never make measurements;The Earth got hotter in 2014;Old measurements were always right|المعرفة العلمية قد تتغير عندما يجد العلماء أدلة جديدة;العلماء لا يقيسون أبدًا;ازدادت حرارة الأرض عام ٢٠١٤;القياسات القديمة كانت صحيحة دائمًا"),ex:["Scientists used new equipment in a laboratory and measured when iron melts under pressure. The new evidence changed what we know. Our information about the Earth changes over time.", "Science changes with new evidence.", "استخدم العلماء معدات جديدة في المختبر وقاسوا درجة انصهار الحديد تحت الضغط. غيّر الدليل الجديد ما نعرفه. معلوماتنا عن الأرض تتغير مع الزمن.", "العلم يتغير بتغير الأدلة."]});
x("42","K",400,'mcq',"What is melted rock in the mantle called?|ماذا يسمى الصخر المنصهر في الستار؟","Mixes up magma and lava|يخلط بين الصهارة والحمم",{o:sp("Magma;Lava;Ash;Crust|الصهارة;الحمم;الرماد;القشرة"),ex:["The rocks in the mantle are melted by heat and are called magma. When the magma erupts onto the surface it is called lava.", "Under the ground = magma. On the surface = lava.", "الصخور في الستار منصهرة بالحرارة وتسمى صهارة. وعندما تثور الصهارة على السطح تسمى حممًا.", "تحت الأرض = صهارة. على السطح = حمم."]});
x("42","K",475,'mcq',"What is the hole at the top of a volcano called?|ماذا يسمى الثقب في أعلى البركان؟","Mixes up the crater and the vent|يخلط بين الفوهة والمدخنة",{o:sp("Crater;Vent;Secondary cone;Plateau|الفوهة;المدخنة;المخروط الثانوي;الهضبة"),ex:["Materials flow up a central pipe called the vent. At the surface the vent widens to form a crater. A secondary cone is a baby volcano on the side.", "Vent = pipe. Crater = hole at the top.", "تصعد المواد عبر أنبوب مركزي يسمى المدخنة. وعند السطح تتسع لتكوّن الفوهة. والمخروط الثانوي بركان صغير على الجانب.", "المدخنة = الأنبوب. الفوهة = الحفرة في الأعلى."]});
x("42","A",475,'mcq',"A map shows many volcanoes around the Pacific Ocean. What is this area called?|تُظهر خريطة براكين كثيرة حول المحيط الهادئ. ماذا تسمى هذه المنطقة؟","Does not know where volcanoes occur|لا يعرف أين تقع البراكين",{o:sp("The Pacific Ring of Fire;The Equator;The Arctic Circle;The Great Plateau|حلقة النار في المحيط الهادئ;خط الاستواء;الدائرة القطبية;الهضبة الكبرى"),ex:["Many volcanoes are found around the Pacific Ocean in the Pacific Ring of Fire. There are many cracks in the Earth's crust there, so magma can reach the surface.", "Volcanoes occur where the crust has cracks.", "توجد براكين كثيرة حول المحيط الهادئ فيما يسمى حلقة النار. وتوجد شقوق كثيرة في قشرة الأرض هناك فتصل الصهارة إلى السطح.", "البراكين تحدث حيث توجد شقوق في القشرة."]});
x("42","A",475,'mcq',"A volcano has layers of ash and lava that build a cone-shaped mountain. What type is it?|لبركان طبقات من الرماد والحمم تبني جبلًا مخروطيًا. ما نوعه؟","Mixes up types of volcano|يخلط بين أنواع البراكين",{o:sp("A composite volcano;A volcanic plateau;A secondary cone;A crater|بركان مركّب;هضبة بركانية;مخروط ثانوي;فوهة"),ex:["The most common type is the composite volcano, with layers of ash and lava that make a cone-shaped mountain. Very hot, fast-flowing lava can spread out in flat layers called a volcanic plateau.", "Composite = layers of ash and lava, cone shape.", "أشيع الأنواع هو البركان المركّب وله طبقات من الرماد والحمم تبني جبلًا مخروطيًا. أما الحمم الساخنة جدًا السريعة الجريان فتنتشر في طبقات مسطحة تسمى هضبة بركانية.", "مركّب = طبقات رماد وحمم وشكل مخروطي."]});
x("42","R",550,'mcq',"Many people choose to live near volcanoes even though they are dangerous. What is a good reason?|يختار كثيرون العيش قرب البراكين رغم خطرها. ما سبب وجيه؟","Thinks volcanoes only cause harm|يظن أن البراكين تضر فقط",{o:sp("Lava and ash make good soil, so crops grow very well;Volcanoes are always safe;Volcanoes make the weather cold;There are no risks|الحمم والرماد تصنع تربة جيدة فتنمو المحاصيل جيدًا;البراكين آمنة دائمًا;البراكين تجعل الطقس باردًا;لا توجد مخاطر"),ex:["Volcanoes have positive and negative effects. Ash and lava make good fertile soil, hot water can heat homes and make electricity, and tourists bring jobs. But lava and ash also destroy crops and buildings.", "Volcanoes: good soil and hot water, but also danger.", "للبراكين آثار إيجابية وسلبية. الرماد والحمم تصنع تربة خصبة، والماء الساخن يدفّئ البيوت وينتج كهرباء، والسياح يوفرون وظائف. لكن الحمم والرماد تدمر المحاصيل والمباني.", "البراكين: تربة جيدة وماء ساخن لكن فيها خطر."]});
x("42","R",625,'mcq',"Indonesia, Japan and the Philippines have a high risk of volcanoes, but some places have none. What is the best explanation?|إندونيسيا واليابان والفلبين معرّضة لخطر البراكين بينما بعض الأماكن لا براكين فيها. ما أفضل تفسير؟","Cannot explain where volcanoes occur|لا يفسر أماكن حدوث البراكين",{o:sp("Volcanoes erupt where there are cracks in the Earth's crust, and those countries have many cracks;They are bigger countries;They are nearer to the Sun;They have more rain|البراكين تثور حيث توجد شقوق في القشرة وهذه البلدان فيها شقوق كثيرة;هي بلدان أكبر;هي أقرب إلى الشمس;فيها مطر أكثر"),ex:["Magma moves up through cracks in the crust. Areas with many cracks, like the Pacific Ring of Fire, have a high risk. Areas with no cracks have a low risk.", "Cracks in the crust = high volcano risk.", "تصعد الصهارة عبر الشقوق في القشرة. المناطق ذات الشقوق الكثيرة مثل حلقة النار تكون خطورتها عالية، والمناطق بلا شقوق خطورتها قليلة.", "شقوق في القشرة = خطر بركاني عالٍ."]});
x("43","K",400,'mcq',"What is an earthquake?|ما الزلزال؟","Confuses earthquakes with tsunamis|يخلط بين الزلازل والتسونامي",{o:sp("A shaking of the Earth;A huge sea wave;A kind of volcano;A layer of the Earth|اهتزاز للأرض;موجة بحرية ضخمة;نوع من البراكين;طبقة من الأرض"),ex:["'Quake' means shaking, so an earthquake is a shaking of the Earth. It happens when there are sudden movements of rock in the Earth's crust.", "Earthquake = shaking of the Earth.", "كلمة «quake» تعني اهتزازًا، فالزلزال هو اهتزاز الأرض. ويحدث عند حركات مفاجئة للصخور في قشرة الأرض.", "زلزال = اهتزاز الأرض."]});
x("43","K",475,'mcq',"What is the point on the surface directly above where an earthquake begins called?|ماذا يسمى المكان على السطح الواقع فوق نقطة بدء الزلزال مباشرة؟","Mixes up focus and epicentre|يخلط بين البؤرة ومركز السطح",{o:sp("The epicentre;The focus;The crater;The vent|مركز السطح (البؤرة السطحية);البؤرة;الفوهة;المدخنة"),ex:["The focus is where the earthquake starts inside the crust. The epicentre is the point on the surface above the focus, and the worst damage is usually felt there.", "Focus = inside the crust. Epicentre = on the surface.", "البؤرة هي المكان الذي يبدأ فيه الزلزال داخل القشرة. ومركز السطح هو النقطة على السطح فوق البؤرة وأشد الأضرار تقع عادة هناك.", "البؤرة = داخل القشرة. مركز السطح = على السطح."]});
x("43","A",475,'mcq',"What causes a tsunami?|ما سبب التسونامي؟","Does not link tsunamis to earthquakes|لا يربط التسونامي بالزلازل",{o:sp("An earthquake or volcanic eruption under the sea;Strong winds only;The Moon's light;A big rainstorm|زلزال أو ثوران بركاني تحت البحر;رياح قوية فقط;ضوء القمر;عاصفة مطرية كبيرة"),ex:["A tsunami is a huge sea wave. The energy from an earthquake or an eruption under the sea transfers to the water and makes the huge waves. In shallow coastal water the wave can reach 50 metres high.", "Earthquake under the sea → energy → tsunami.", "التسونامي موجة بحرية ضخمة. تنتقل طاقة الزلزال أو الثوران تحت البحر إلى الماء فتصنع الأمواج الضخمة. وفي المياه الضحلة قرب الساحل قد يبلغ ارتفاعها ٥٠ مترًا.", "زلزال تحت البحر ← طاقة ← تسونامي."]});
x("43","A",475,'mcq',"How does an earthquake happen?|كيف يحدث الزلزال؟","Does not know the cause of earthquakes|لا يعرف سبب الزلازل",{o:sp("Pieces of the Earth's crust suddenly move and rub together, and the energy travels as waves;The Sun heats the sea;Magma cools very quickly;The Moon pulls on the crust|تتحرك قطع من قشرة الأرض فجأة وتحتك ببعضها وتنتقل الطاقة على شكل موجات;الشمس تسخن البحر;الصهارة تبرد بسرعة;القمر يجذب القشرة"),ex:["The crust is made of huge pieces of flat rock. Where two pieces meet they rub together, creating huge amounts of energy. The energy changes into waves that travel through the crust and we feel them as an earthquake.", "Moving rock → energy → waves → earthquake.", "تتكوّن القشرة من قطع ضخمة مسطحة من الصخر. وحيث تلتقي قطعتان تحتكان فتتولد طاقة هائلة. تتحول إلى موجات تنتقل عبر القشرة ونشعر بها زلزالًا.", "صخور تتحرك ← طاقة ← موجات ← زلزال."]});
x("43","R",550,'mcq',"After a big earthquake near Chile, small waves reached California and Japan. What is the best explanation?|بعد زلزال كبير قرب تشيلي وصلت أمواج صغيرة إلى كاليفورنيا واليابان. ما أفضل تفسير؟","Does not link a tsunami to energy transfer|لا يربط التسونامي بانتقال الطاقة",{o:sp("The earthquake started a tsunami whose energy travelled across the Pacific Ocean;The Moon pushed the waves;It rained in California;Japan was the epicentre|بدأ الزلزال تسونامي انتقلت طاقته عبر المحيط الهادئ;القمر دفع الأمواج;هطل المطر في كاليفورنيا;كانت اليابان مركز الزلزال"),ex:["The earthquake was under the sea, so its energy transferred to the water and made a tsunami. The waves travelled far across the ocean and caused minor damage in California and Japan.", "Wave energy travels far across the sea.", "كان الزلزال تحت البحر فانتقلت طاقته إلى الماء وصنعت تسونامي. سافرت الأمواج بعيدًا عبر المحيط وسببت أضرارًا طفيفة في كاليفورنيا واليابان.", "طاقة الأمواج تنتقل بعيدًا عبر البحر."]});
x("43","R",625,'mcq',"Earthquakes and volcanoes happen in the same parts of the world. Why?|تحدث الزلازل والبراكين في الأجزاء نفسها من العالم. لماذا؟","Treats earthquakes and volcanoes as unrelated|يعدّ الزلازل والبراكين غير مرتبطين",{o:sp("Both happen where the rocks of the crust are broken and moving;Both are caused by the Moon;Both are caused by wind;Both happen only near the Equator|كلاهما يحدث حيث تكون صخور القشرة متشققة ومتحركة;كلاهما بسبب القمر;كلاهما بسبب الرياح;كلاهما قرب خط الاستواء فقط"),ex:["Both volcanoes and earthquakes happen where the crust is cracked and moving. Most earthquakes happen in the Pacific Ring of Fire, where there are also many volcanoes.", "Moving, cracked crust → volcanoes AND earthquakes.", "تحدث البراكين والزلازل حيث تكون القشرة متشققة ومتحركة. ومعظم الزلازل تقع في حلقة النار في المحيط الهادئ حيث توجد براكين كثيرة أيضًا.", "قشرة متشققة ومتحركة ← براكين وزلازل."]});
x("44","K",400,'mcq',"What do fish use to breathe underwater?|ماذا تستخدم الأسماك للتنفس تحت الماء؟","Mixes up gills and fins|يخلط بين الخياشيم والزعانف",{o:sp("Gills;Fins;Beaks;Feathers|الخياشيم;الزعانف;المناقير;الريش"),ex:["Fish have an organ called gills to breathe underwater. Their fins help them to swim.", "Gills = breathe. Fins = swim.", "للأسماك عضو يسمى الخياشيم تتنفس به تحت الماء، وتساعدها الزعانف على السباحة.", "خياشيم = تنفس. زعانف = سباحة."]});
x("44","K",475,'mcq',"What is a flamingo's long, flat beak used for?|ما فائدة منقار الفلامنغو الطويل المسطح؟","Does not match beak shape to food|لا يربط شكل المنقار بالغذاء",{o:sp("Straining small plants and animals out of the water;Cracking open hard seeds;Catching large fish;Digging for worms|ترشيح النباتات والحيوانات الصغيرة من الماء;كسر البذور الصلبة;صيد الأسماك الكبيرة;الحفر بحثًا عن الديدان"),ex:["A flamingo's beak is long and flat and can strain, or sieve, small plants and animals from the water in rivers and dams.", "Beak shape matches the food a bird eats.", "منقار الفلامنغو طويل ومسطح ويستطيع ترشيح النباتات والحيوانات الصغيرة من الماء في الأنهار والسدود.", "شكل المنقار يناسب غذاء الطائر."]});
x("44","A",475,'mcq',"A pigeon has a small, pointed beak. What does it mainly eat?|للحمام منقار صغير مدبب. ماذا يأكل في الغالب؟","Cannot link beak to food|لا يربط المنقار بالغذاء",{o:sp("Seeds, which it cracks open with its beak;Fish from rivers;Small plants strained from water;Nectar deep in flowers|البذور ويكسرها بمنقاره;أسماكًا من الأنهار;نباتات صغيرة يرشحها من الماء;رحيقًا في عمق الأزهار"),ex:["A pigeon eats mainly seeds. Its small, pointed beak can crack open seeds. A kingfisher has a large sharp beak for fish, and a starling has a longer pointed beak to dig for worms.", "Small pointed beak = seed eater.", "يأكل الحمام البذور في الغالب. ومنقاره الصغير المدبب يكسر البذور. أما الرفراف فمنقاره كبير حاد لصيد السمك والزرزور منقاره أطول مدبب للحفر بحثًا عن الديدان.", "منقار صغير مدبب = آكل بذور."]});
x("44","A",475,'mcq',"Tigers live in forests. How do their stripes help them?|تعيش النمور في الغابات. كيف تساعدها خطوطها؟","Does not link features to the habitat|لا يربط الصفات بالبيئة",{o:sp("The stripes help break up the tiger's shape so small animals find it hard to see it;They keep the tiger cold;They help it fly;They help it swim|الخطوط تفكك شكل النمر فيصعب على الحيوانات الصغيرة رؤيته;تبقيه باردًا;تساعده على الطيران;تساعده على السباحة"),ex:["The stripes help the tiger blend in with sunlight on the forest floor and break up its body shape. This makes it difficult for the animals it hunts to see it.", "Features help animals survive in their habitat.", "تساعد الخطوط النمر على الاندماج مع ضوء الشمس على أرض الغابة وتفكك شكل جسمه، فيصعب على الحيوانات التي يصطادها رؤيته.", "الصفات تساعد الحيوان على البقاء في بيئته."]});
x("44","R",550,'mcq',"Orchids naturally live in hot, wet forests, but many people keep them in pots at home. How can they survive?|تعيش السحلبيات طبيعيًا في الغابات الحارة الرطبة لكن كثيرين يزرعونها في أصص بالبيوت. كيف تعيش؟","Thinks plants only survive in their natural habitat|يظن أن النباتات تعيش في بيئتها الطبيعية فقط",{o:sp("People give them what they need, such as water and warmth;They no longer need anything;They change into other plants;They make their own habitat|يوفر الناس لها ما تحتاج مثل الماء والدفء;لا تحتاج شيئًا بعد الآن;تتحول إلى نباتات أخرى;تصنع بيئتها بنفسها"),ex:["Plants and animals can survive outside their normal habitat if their needs are met. A gardener waters and cares for plants so they can live in a drier place than their natural habitat.", "Needs met = can survive outside the natural habitat.", "تستطيع النباتات والحيوانات العيش خارج بيئتها الطبيعية إذا لُبّيت حاجاتها. فالبستاني يسقي النباتات ويعتني بها لتعيش في مكان أجف من بيئتها الطبيعية.", "حاجات ملباة = بقاء خارج البيئة الطبيعية."]});
x("44","R",550,'mcq',"A student watches birds on one day only. Why is it better to repeat the observations on different days?|يراقب طالب الطيور يومًا واحدًا. لماذا من الأفضل تكرار الملاحظات في أيام مختلفة؟","Does not know why we repeat observations|لا يعرف لماذا نكرر الملاحظات",{o:sp("Repeating gives more reliable data about what the birds eat;Birds change colour each day;It makes the birds hungrier;It is faster|التكرار يعطي بيانات أوثق عما تأكله الطيور;الطيور تغيّر لونها كل يوم;يجعل الطيور أجوع;أسرع"),ex:["One day's results may be unusual. If we repeat observations on different days and get similar results, our data is more reliable.", "Repeat → more reliable data.", "قد تكون نتائج يوم واحد غير معتادة. وإذا كررنا الملاحظات في أيام مختلفة وحصلنا على نتائج متقاربة تكون بياناتنا أوثق.", "التكرار ← بيانات أوثق."]});
x("51","K",400,'mcq',"Which of these is a source of light?|أي مما يلي مصدر للضوء؟","Thinks any bright object makes its own light|يظن أن أي جسم لامع يصنع ضوءه",{o:sp("The Sun;A mirror;A book;The Moon|الشمس;مرآة;كتاب;القمر"),ex:["A source of light makes its own light, like the Sun. A mirror, a book and the Moon only reflect light from a source.", "Source = makes its own light.", "مصدر الضوء يصنع ضوءه بنفسه مثل الشمس. أما المرآة والكتاب والقمر فتعكس ضوء مصدر فقط.", "المصدر = يصنع ضوءه بنفسه."]});
x("51","K",475,'mcq',"We see an object that is not a source of light when light…|نرى جسمًا ليس مصدرًا للضوء عندما…","Thinks light comes out of our eyes|يظن أن الضوء يخرج من عيوننا",{o:sp("reflects off the object and enters our eyes;travels from our eyes to the object;stops at the object;is absorbed by our eyes only|ينعكس الضوء عن الجسم ويدخل عيوننا;ينتقل الضوء من عيوننا إلى الجسم;يتوقف الضوء عند الجسم;يمتصه الجسم وحده"),ex:["Light travels from a source to the object. It bounces, or reflects, off the object into our eyes, and that is how we see it.", "Source → object → reflects → eye.", "ينتقل الضوء من المصدر إلى الجسم ثم يرتد (ينعكس) عن الجسم إلى عيوننا فنراه.", "مصدر ← جسم ← انعكاس ← عين."]});
x("51","A",475,'mcq',"A coin is at the bottom of a closed box with a small viewing hole. With no flashlight, can you see the coin? Why?|توجد قطعة نقد في قاع صندوق مغلق فيه ثقب للمشاهدة. دون مصباح هل ترى القطعة؟ ولماذا؟","Does not know we need light to see|لا يعرف أننا نحتاج إلى الضوء لنرى",{o:sp("No, because there is no light to reflect off the coin into your eyes;Yes, because the coin makes light;Yes, because your eyes make light;No, because coins cannot reflect light|لا لأنه لا يوجد ضوء ينعكس عن القطعة إلى عينيك;نعم لأن القطعة تصنع الضوء;نعم لأن عينيك تصنع الضوء;لا لأن القطع لا تعكس الضوء"),ex:["We can only see an object when light reflects off it into our eyes. In a dark box there is no light, so the coin cannot be seen. When the flashlight is on, the light reflects off the coin.", "No light = nothing to see.", "لا نرى الجسم إلا إذا انعكس الضوء عنه إلى عيوننا. في الصندوق المظلم لا ضوء فلا نرى القطعة. وعند تشغيل المصباح ينعكس الضوء عن القطعة.", "لا ضوء = لا رؤية."]});
x("51","R",550,'mcq',"Rachel can only see her cat in a dark room when her torch is on. What does this show about the cat?|لا ترى راشيل قطتها في غرفة مظلمة إلا عند تشغيل مصباحها. ماذا يدل ذلك على القطة؟","Cannot reason from evidence about sources of light|لا يستدل بالدليل على مصادر الضوء",{o:sp("The cat is not a source of light, so she sees it by reflected light;The cat is a source of light;The cat absorbs the torch;The cat makes the torch light|القطة ليست مصدر ضوء وتراها بالضوء المنعكس;القطة مصدر ضوء;القطة تمتص المصباح;القطة تصنع ضوء المصباح"),ex:["If the cat made its own light, Rachel could see it in the dark. She can only see it when the torch lights it, so the light reflects off the cat into her eyes.", "Can't see it in the dark = not a light source.", "لو كانت القطة تصنع ضوءها لرأتها راشيل في الظلام. لكنها لا تراها إلا عندما يضيئها المصباح، أي أن الضوء ينعكس عنها إلى عينيها.", "لا تُرى في الظلام = ليست مصدر ضوء."]});
x("52","K",400,'mcq',"How does light travel?|كيف ينتقل الضوء؟","Thinks light can bend around corners|يظن أن الضوء ينحني حول الزوايا",{o:sp("In straight lines;In curved lines;In circles;In zigzags|في خطوط مستقيمة;في خطوط منحنية;في دوائر;في خطوط متعرجة"),ex:["Light travels from a source in straight lines. A narrow beam of light is called a ray, and rays travel in all directions until they hit something.", "Light = straight lines (rays).", "ينتقل الضوء من المصدر في خطوط مستقيمة. ويسمى الشعاع الضيق من الضوء شعاعًا وتنتقل الأشعة في كل الاتجاهات حتى تصطدم بشيء.", "الضوء = خطوط مستقيمة (أشعة)."]});
x("52","K",475,'mcq',"What does the arrowhead on a ray in a ray diagram show?|ماذا يبيّن رأس السهم على الشعاع في مخطط الأشعة؟","Does not read ray diagrams|لا يقرأ مخططات الأشعة",{o:sp("The direction the light ray is moving;How bright the light is;The colour of the light;How long the light takes|اتجاه حركة شعاع الضوء;مقدار سطوع الضوء;لون الضوء;الزمن الذي يستغرقه الضوء"),ex:["In a ray diagram we draw straight lines for the rays and an arrowhead to show the direction the ray is travelling.", "Ray diagram: straight line + arrow = direction.", "في مخطط الأشعة نرسم خطوطًا مستقيمة للأشعة ورأس سهم يبيّن اتجاه سير الشعاع.", "مخطط الأشعة: خط مستقيم + سهم = الاتجاه."]});
x("52","A",475,'mcq',"A torch shines into a flexible plastic tube. If the tube is bent, will your partner see the light at the other end? Why?|يضيء مصباح داخل أنبوب بلاستيكي مرن. إذا انحنى الأنبوب هل يرى زميلك الضوء من الطرف الآخر؟ ولماذا؟","Predicts that light can go round a corner|يتوقع أن الضوء يلتف حول الزاوية",{o:sp("No, because light travels in straight lines and cannot go round the bend;Yes, because light bends;Yes, because the tube makes light;No, because the tube is plastic|لا لأن الضوء ينتقل في خطوط مستقيمة ولا يدور حول الانحناء;نعم لأن الضوء ينحني;نعم لأن الأنبوب يصنع الضوء;لا لأن الأنبوب بلاستيك"),ex:["Light travels in straight lines. With a straight tube the light reaches the other end, but a bend blocks it, so your partner cannot see the light.", "Straight tube = light seen. Bent tube = no light.", "ينتقل الضوء في خطوط مستقيمة. مع الأنبوب المستقيم يصل الضوء إلى الطرف الآخر أما الانحناء فيحجبه فلا يرى زميلك الضوء.", "أنبوب مستقيم = يُرى الضوء. أنبوب منحنٍ = لا ضوء."]});
x("52","R",550,'mcq',"Light is seen through a straight tube but not through a bent tube. What is the best conclusion?|يُرى الضوء عبر أنبوب مستقيم ولا يُرى عبر أنبوب منحنٍ. ما أفضل استنتاج؟","Cannot draw a conclusion from evidence|لا يستنتج من الدليل",{o:sp("Light travels in straight lines;Light travels in curves;Light needs a plastic tube;Light cannot travel through air|الضوء ينتقل في خطوط مستقيمة;الضوء ينتقل في منحنيات;الضوء يحتاج أنبوبًا بلاستيكيًا;الضوء لا ينتقل في الهواء"),ex:["The light reached the other end only when the tube was straight. This is proof, or evidence, that light travels in straight lines.", "Evidence → conclusion: light goes straight.", "وصل الضوء إلى الطرف الآخر فقط عندما كان الأنبوب مستقيمًا. وهذا برهان (دليل) على أن الضوء ينتقل في خطوط مستقيمة.", "دليل ← استنتاج: الضوء يسير مستقيمًا."]});
x("53","K",400,'mcq',"Which surface is very good at reflecting light?|أي سطح يعكس الضوء جيدًا جدًا؟","Thinks all surfaces reflect equally well|يظن أن كل الأسطح تعكس بالقدر نفسه",{o:sp("A smooth, shiny mirror;A rough wooden board;A piece of cloth;A piece of paper|مرآة ملساء لامعة;لوح خشب خشن;قطعة قماش;قطعة ورق"),ex:["A smooth, shiny surface reflects light very well. A mirror has a smooth shiny surface, so we can see our image in it.", "Smooth + shiny = good reflection.", "السطح الأملس اللامع يعكس الضوء جيدًا جدًا. وللمرآة سطح أملس لامع لذلك نرى صورتنا فيها.", "أملس + لامع = انعكاس جيد."]});
x("53","K",475,'mcq',"What happens to light when it hits a surface that absorbs light?|ماذا يحدث للضوء عندما يصطدم بسطح يمتص الضوء؟","Mixes up absorbing and reflecting|يخلط بين الامتصاص والانعكاس",{o:sp("The surface takes the light in and does not reflect it;It bounces back perfectly;It turns into a mirror;It speeds up|يمتص السطح الضوء ولا يعكسه;يرتد تمامًا;يتحول إلى مرآة;يزداد سرعة"),ex:["A surface that absorbs light takes the light in and does not reflect it. If you cannot see your reflection in a surface, it absorbs light.", "No reflection = absorbs light.", "السطح الذي يمتص الضوء يأخذه ولا يعكسه. وإذا لم ترَ انعكاسك في سطح ما فهو يمتص الضوء.", "لا انعكاس = السطح يمتص الضوء."]});
x("53","A",475,'mcq',"A dentist uses a small mirror in a patient's mouth. How does it help?|يستخدم طبيب الأسنان مرآة صغيرة في فم المريض. كيف تساعده؟","Does not know how mirrors are used|لا يعرف كيف تُستعمل المرايا",{o:sp("It reflects light so he can see teeth he could not see directly;It makes the teeth bigger by magic;It makes light;It cools the teeth|تعكس الضوء فيرى أسنانًا لا يستطيع رؤيتها مباشرة;تكبّر الأسنان بالسحر;تصنع الضوء;تبرّد الأسنان"),ex:["A mirror reflects light. The dentist can see the light reflected from the teeth in the mirror, so he sees places he could not see directly.", "Mirrors let us see around and behind things.", "تعكس المرآة الضوء. فيرى الطبيب الضوء المنعكس عن الأسنان في المرآة فيشاهد أماكن لا يراها مباشرة.", "المرايا تُرينا ما خلف الأشياء وحولها."]});
x("53","R",550,'mcq',"Under a microscope a piece of paper has lots of bumps. What does this help to explain?|تحت المجهر تبدو قطعة الورق ذات نتوءات كثيرة. ماذا يساعد ذلك على تفسيره؟","Thinks smooth-looking surfaces are always smooth|يظن أن السطح الذي يبدو أملس أملس دائمًا",{o:sp("Paper is not completely smooth, so it absorbs a lot more light than it reflects;Paper is a mirror;Paper makes light;Paper is a source of light|الورق ليس أملس تمامًا لذا يمتص ضوءًا أكثر مما يعكس;الورق مرآة;الورق يصنع الضوء;الورق مصدر ضوء"),ex:["A surface that is not completely smooth absorbs a lot of light. Paper looks smooth, but the microscope shows its bumps, so we cannot see our reflection in it.", "Bumpy surface → absorbs more light.", "السطح غير الأملس تمامًا يمتص ضوءًا كثيرًا. يبدو الورق أملس لكن المجهر يُظهر نتوءاته لذلك لا نرى انعكاسنا فيه.", "سطح خشن ← يمتص ضوءًا أكثر."]});
x("53","R",625,'mcq',"Marcus cannot see himself in a wooden chopping board but Arun can see himself in a mirror. What is the best explanation?|لا يرى ماركوس نفسه في لوح تقطيع خشبي بينما يرى أرون نفسه في مرآة. ما أفضل تفسير؟","Cannot explain differences in reflection|لا يفسر اختلاف الانعكاس",{o:sp("The wood absorbs light while the mirror reflects it very well;The mirror makes light;The wood is darker than the Sun;Mirrors absorb light|الخشب يمتص الضوء بينما تعكسه المرآة جيدًا جدًا;المرآة تصنع الضوء;الخشب أغمق من الشمس;المرايا تمتص الضوء"),ex:["All objects reflect or absorb light. A mirror is smooth and shiny and reflects light well, so we see an image. Wood absorbs light, so no reflection is seen.", "Reflect well → see image. Absorb → no image.", "كل الأجسام تعكس الضوء أو تمتصه. المرآة ملساء لامعة وتعكس الضوء جيدًا فنرى صورة. أما الخشب فيمتص الضوء فلا نرى انعكاسًا.", "انعكاس جيد ← صورة. امتصاص ← لا صورة."]});
x("54","K",400,'mcq',"What is at the centre of our solar system?|ما الذي يقع في مركز نظامنا الشمسي؟","Thinks the Earth is at the centre|يظن أن الأرض في المركز",{o:sp("The Sun;The Earth;The Moon;Jupiter|الشمس;الأرض;القمر;المشتري"),ex:["The Sun is at the centre of the solar system. The eight planets orbit the Sun, and the Sun is our source of light.", "Sun in the centre. Eight planets orbit it.", "الشمس في مركز النظام الشمسي. وتدور حولها الكواكب الثمانية والشمس مصدر الضوء لنا.", "الشمس في المركز. ثمانية كواكب تدور حولها."]});
x("54","K",475,'mcq',"How many planets orbit the Sun in our solar system?|كم كوكبًا يدور حول الشمس في نظامنا الشمسي؟","Does not know the number of planets|لا يعرف عدد الكواكب",{o:sp("Eight;Six;Nine;Ten|ثمانية;ستة;تسعة;عشرة"),ex:["There are eight planets orbiting the Sun. In order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.", "8 planets.", "هناك ثمانية كواكب تدور حول الشمس. بالترتيب من الشمس: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون.", "٨ كواكب."]});
x("54","A",475,'mcq',"Planet A takes 88 Earth days to orbit the Sun. Planet B takes 29.5 Earth years. Which one is Saturn?|يستغرق الكوكب A دورة حول الشمس مدتها ٨٨ يومًا أرضيًا، والكوكب B ٢٩٫٥ سنة أرضية. أيهما زحل؟","Thinks closer planets take longer|يظن أن الكواكب الأقرب تستغرق وقتًا أطول",{o:sp("B, because planets further from the Sun take longer to orbit;A, because Saturn is small;A, because it is closest to the Sun;B, because it is nearest to Earth|B لأن الكواكب الأبعد عن الشمس تستغرق وقتًا أطول للدوران;A لأن زحل صغير;A لأنه الأقرب إلى الشمس;B لأنه الأقرب إلى الأرض"),ex:["Planets closer to the Sun than Earth take less than an Earth year to orbit. Planets further from the Sun take more. Saturn is far from the Sun, so it takes a long time, 29.5 Earth years. Planet A is Mercury.", "Further from the Sun = longer orbit.", "الكواكب الأقرب من الأرض إلى الشمس تدور في أقل من سنة أرضية، والأبعد تستغرق أكثر. زحل بعيد عن الشمس فيستغرق ٢٩٫٥ سنة أرضية. أما A فهو عطارد.", "أبعد عن الشمس = مدار أطول."]});
x("54","A",475,'mcq',"Which body is a lump of ice and dirt that has a long tail and moves in a large orbit around the Sun?|أي جرم كتلة من الجليد والتراب له ذيل طويل ويتحرك في مدار كبير حول الشمس؟","Mixes up comets and asteroids|يخلط بين المذنبات والكويكبات",{o:sp("A comet;An asteroid;A moon;A planet|مذنّب;كويكب;قمر;كوكب"),ex:["Comets are lumps of ice and dirt with long tails. Asteroids are rocky masses that orbit the Sun, mostly in the asteroid belt between Mars and Jupiter. Moons orbit planets.", "Comet = ice + tail. Asteroid = rock.", "المذنبات كتل من الجليد والتراب لها ذيول طويلة. والكويكبات كتل صخرية تدور حول الشمس معظمها في حزام الكويكبات بين المريخ والمشتري. والأقمار تدور حول الكواكب.", "مذنب = جليد + ذيل. كويكب = صخر."]});
x("54","R",550,'mcq',"We can see the stars at night. What does this tell us about stars?|نرى النجوم في الليل. ماذا يدل ذلك على النجوم؟","Does not know stars are light sources|لا يعرف أن النجوم مصادر للضوء",{o:sp("Stars give out their own light, which travels to Earth and enters our eyes;Stars only reflect the Sun;Stars are planets;Stars are asteroids|النجوم تُصدر ضوءها الخاص الذي ينتقل إلى الأرض ويدخل عيوننا;النجوم تعكس ضوء الشمس فقط;النجوم كواكب;النجوم كويكبات"),ex:["Each star gives out light, like our Sun. The light from the stars travels to Earth and enters our eyes, so we can see them. Planets and the Moon only reflect light.", "Stars make light. Planets and moons reflect it.", "كل نجم يُصدر ضوءًا مثل شمسنا. وينتقل ضوء النجوم إلى الأرض ويدخل عيوننا فنراها. أما الكواكب والقمر فتعكس الضوء فقط.", "النجوم تصنع الضوء. الكواكب والأقمار تعكسه."]});
x("55","K",475,'mcq',"How long does the Earth take to make one complete spin on its axis?|كم تستغرق الأرض لتدور دورة كاملة حول محورها؟","Mixes up spin and orbit times|يخلط بين زمن الدوران حول المحور والمدار",{o:sp("24 hours;365 days;29 days;12 hours|٢٤ ساعة;٣٦٥ يومًا;٢٩ يومًا;١٢ ساعة"),ex:["The Earth does one complete turn on its axis every 24 hours. It takes about 365 and a quarter days to orbit the Sun, and the Moon takes about 29 days to orbit the Earth.", "Spin = 24 hours. Orbit of the Sun = 1 year.", "تدور الأرض دورة كاملة حول محورها كل ٢٤ ساعة. وتستغرق نحو ٣٦٥ يومًا وربع لتدور حول الشمس، والقمر نحو ٢٩ يومًا ليدور حول الأرض.", "الدوران حول المحور = ٢٤ ساعة. المدار حول الشمس = سنة."]});
x("55","A",475,'mcq',"In a model with a globe and a flashlight, what does the flashlight represent?|في نموذج فيه كرة أرضية ومصباح، ماذا يمثل المصباح؟","Mixes up the parts of the model|يخلط بين أجزاء النموذج",{o:sp("The Sun;The Moon;The Earth;A star far away|الشمس;القمر;الأرض;نجمًا بعيدًا"),ex:["In the model the flashlight is the Sun and the globe is the Earth. Only the half of the globe facing the flashlight is lit, which shows day on that half and night on the other half.", "Flashlight = Sun. Globe = Earth.", "في النموذج المصباح هو الشمس والكرة هي الأرض. يضاء فقط نصف الكرة المواجه للمصباح، وهذا يمثل النهار على ذلك النصف والليل على النصف الآخر.", "المصباح = الشمس. الكرة = الأرض."]});
x("55","A",550,'mcq',"It is lunchtime in Malaysia. Why should Ali not phone Farouk in Spain right now?|الوقت ظهرًا في ماليزيا. لماذا لا يتصل علي بفاروق في إسبانيا الآن؟","Does not link day and night to the Earth's spin|لا يربط الليل والنهار بدوران الأرض",{o:sp("Spain is on the other side of the spinning Earth, where it is night;The Sun has stopped;Spain has no Sun;Phones do not work at lunchtime|إسبانيا على الجانب الآخر من الأرض الدوّارة حيث يكون الليل;توقفت الشمس;لا شمس في إسبانيا;الهواتف لا تعمل وقت الغداء"),ex:["The Earth spins, so when one place is in sunlight (day), a place on the other side is in darkness (night). When it is lunchtime in Malaysia it is night in Spain, so Farouk may be asleep.", "Day in one place = night on the far side.", "تدور الأرض فعندما يكون مكان في ضوء الشمس (نهار) يكون مكان على الجانب الآخر في الظلام (ليل). فعندما يكون الظهر في ماليزيا يكون الليل في إسبانيا وقد يكون فاروق نائمًا.", "نهار في مكان = ليل في الجانب البعيد."]});
x("55","R",550,'mcq',"The Sun seems to move across the sky each day. What is the real explanation?|تبدو الشمس وكأنها تتحرك عبر السماء كل يوم. ما التفسير الحقيقي؟","Believes the Sun really moves|يظن أن الشمس تتحرك فعلًا",{o:sp("The Earth spins on its axis, so the Sun's position seems to change;The Sun really moves around the Earth;The Moon pushes the Sun;The sky moves|الأرض تدور حول محورها فيبدو أن موضع الشمس يتغير;الشمس تدور فعلًا حول الأرض;القمر يدفع الشمس;السماء تتحرك"),ex:["The Sun's movement across the sky is only apparent movement. In fact the Earth spins on its axis, and this causes day and night.", "Apparent movement of the Sun = Earth spinning.", "حركة الشمس عبر السماء حركة ظاهرية فقط. والحقيقة أن الأرض تدور حول محورها وهذا ما يسبب الليل والنهار.", "الحركة الظاهرية للشمس = دوران الأرض."]});
x("55","R",625,'mcq',"Imagine the Earth completed one spin every 10 hours instead of 24 hours. What would change?|تخيّل أن الأرض تتم دورة كل ١٠ ساعات بدل ٢٤. ماذا يتغير؟","Cannot predict using the Earth's spin|لا يتنبأ باستخدام دوران الأرض",{o:sp("Days and nights would be much shorter;Days would be longer;There would be no night;Nothing would change|ستكون الأيام والليالي أقصر كثيرًا;ستطول الأيام;لن يوجد ليل;لن يتغير شيء"),ex:["One spin on the axis makes one day and one night. If a spin took only 10 hours, a whole day and night would take 10 hours, so each would be much shorter than now.", "Faster spin = shorter day and night.", "كل دورة حول المحور تصنع نهارًا وليلًا. فإذا كانت الدورة ١٠ ساعات فقط يستغرق النهار والليل معًا ١٠ ساعات فيكون كل منهما أقصر كثيرًا.", "دوران أسرع = نهار وليل أقصر."]});
x("56","K",400,'mcq',"What forms a shadow?|ما الذي يكوّن الظل؟","Does not know how shadows form|لا يعرف كيف يتكوّن الظل",{o:sp("An object blocking the light;The light bending;The Moon;Wind|جسم يحجب الضوء;انحناء الضوء;القمر;الرياح"),ex:["A shadow forms when an object blocks the light from a source. Light travels in straight lines, so it cannot go round the object.", "Shadow = light blocked.", "يتكوّن الظل عندما يحجب جسم الضوء القادم من مصدر. وبما أن الضوء ينتقل مستقيمًا فلا يلتف حول الجسم.", "الظل = ضوء محجوب."]});
x("56","A",475,'mcq',"A shadow stick is measured every hour from 09:00 to 15:00. When will its shadow be shortest?|يُقاس ظل عصا كل ساعة من ٩ صباحًا إلى ٣ عصرًا. متى يكون ظلها أقصر؟","Thinks the shadow is shortest in the morning|يظن أن الظل أقصر ما يكون صباحًا",{o:sp("Around midday;At 09:00;At 15:00;At sunrise|قرب منتصف النهار;الساعة ٩ صباحًا;الساعة ٣ عصرًا;عند الشروق"),ex:["At midday the Sun is high in the sky, so the shadow is short. In the morning and late afternoon the Sun is low, so shadows are long. Shadows are longest at sunrise and sunset.", "High Sun = short shadow. Low Sun = long shadow.", "عند منتصف النهار تكون الشمس عالية في السماء فيكون الظل قصيرًا. وفي الصباح وآخر النهار تكون منخفضة فتكون الظلال طويلة. وأطول ظل عند الشروق والغروب.", "شمس عالية = ظل قصير. شمس منخفضة = ظل طويل."]});
x("56","R",550,'mcq',"The shadow of a stick moves from one side to the other during the day. What is the best explanation?|يتحرك ظل عصا من جانب إلى آخر خلال اليوم. ما أفضل تفسير؟","Thinks the Sun really moves|يظن أن الشمس تتحرك فعلًا",{o:sp("The Earth spins on its axis, so the Sun appears to move across the sky;The stick moves;The Moon moves the shadow;The wind moves the shadow|تدور الأرض حول محورها فتبدو الشمس وكأنها تتحرك عبر السماء;العصا تتحرك;القمر يحرك الظل;الرياح تحرك الظل"),ex:["As the Earth spins, the Sun seems to change position in the sky. This changes the direction and the length of the shadow during the day.", "Earth spins → Sun's apparent movement → shadow moves.", "بدوران الأرض يبدو أن موضع الشمس يتغير في السماء فيتغير اتجاه الظل وطوله خلال اليوم.", "الأرض تدور ← حركة ظاهرية للشمس ← يتحرك الظل."]});
x("56","R",550,'mcq',"It was cloudy on the first day of a shadow stick investigation. What should the students do, and why?|كان الجو غائمًا في اليوم الأول من تجربة ظل العصا. ماذا يفعل الطلاب ولماذا؟","Does not know why measurements are repeated|لا يعرف لماذا تُكرر القياسات",{o:sp("Repeat it on other days to get a more complete and reliable set of measurements;Give up;Use the Moon;Measure the shadows of clouds|يكررونها في أيام أخرى للحصول على قياسات أكمل وأوثق;يتوقفون;يستخدمون القمر;يقيسون ظلال السحب"),ex:["If it is cloudy there is no clear shadow. Repeating the investigation on different days gives a more complete set of measurements and therefore more reliable data.", "Repeat measurements = more reliable data.", "عند الغيوم لا يظهر ظل واضح. وتكرار التجربة في أيام مختلفة يعطي مجموعة قياسات أكمل وبالتالي بيانات أوثق.", "تكرار القياسات = بيانات أوثق."]});
x("61","K",400,'mcq',"What is a material that allows electricity to pass through it called?|ماذا نسمي المادة التي تسمح بمرور الكهرباء خلالها؟","Mixes up conductor and insulator|يخلط بين الموصل والعازل",{o:sp("A conductor;An insulator;A switch;A cell|موصل;عازل;مفتاح;خلية"),ex:["A conductor allows electricity to pass through it. An insulator does not allow electricity to pass through it. Metals are good conductors.", "Conductor = lets electricity pass.", "الموصل يسمح بمرور الكهرباء خلاله والعازل لا يسمح. والفلزات موصلات جيدة.", "موصل = يسمح بمرور الكهرباء."]});
x("61","K",475,'mcq',"Which of these is a good electrical conductor?|أي مما يلي موصل جيد للكهرباء؟","Thinks plastic or wood conducts|يظن أن البلاستيك أو الخشب يوصل",{o:sp("Copper;Plastic;Rubber;Wood|النحاس;البلاستيك;المطاط;الخشب"),ex:["Metals such as copper, iron and steel are good electrical conductors. Plastic, rubber and wood are insulators.", "Metals conduct. Plastic, rubber, wood insulate.", "الفلزات مثل النحاس والحديد والفولاذ موصلات جيدة للكهرباء. أما البلاستيك والمطاط والخشب فعوازل.", "الفلزات توصل. البلاستيك والمطاط والخشب تعزل."]});
x("61","A",475,'mcq',"An electric wire has a copper centre covered in plastic. Why is each material used?|سلك كهربائي قلبه من النحاس مغطى بالبلاستيك. لماذا استُخدمت كل مادة؟","Does not link materials to their uses|لا يربط المواد باستخداماتها",{o:sp("Copper conducts electricity and plastic insulates to keep us safe;Plastic conducts and copper insulates;Both are used for colour;Both conduct electricity|النحاس يوصل الكهرباء والبلاستيك يعزل ليحمينا;البلاستيك يوصل والنحاس يعزل;كلاهما للّون;كلاهما يوصل الكهرباء"),ex:["Copper is a good conductor, so electricity can pass through the wire. The plastic is an insulator, so we can touch the wire safely without getting a shock.", "Conductor inside, insulator outside.", "النحاس موصل جيد فتمر الكهرباء في السلك. والبلاستيك عازل فنستطيع لمس السلك بأمان دون صعقة كهربائية.", "موصل بالداخل وعازل بالخارج."]});
x("61","R",550,'mcq',"A lamp lights when a spoon is in a circuit but not when a wooden ruler is. What pattern does this suggest?|يضيء المصباح عند وضع ملعقة في الدائرة ولا يضيء عند وضع مسطرة خشبية. أي نمط يوحي به ذلك؟","Cannot find a pattern in results|لا يجد نمطًا في النتائج",{o:sp("Metals are conductors and wood is an insulator;Wood is a conductor;All materials conduct;Metals are insulators|الفلزات موصلات والخشب عازل;الخشب موصل;كل المواد توصل;الفلزات عوازل"),ex:["The lamp lit with the metal spoon, so electricity passed through it. It did not light with wood, so wood does not let electricity through. The pattern is that metals conduct and non-metals such as wood and plastic insulate.", "Pattern: metals conduct.", "أضاء المصباح مع الملعقة المعدنية فمرّت الكهرباء. ولم يضئ مع الخشب فلا يسمح بمرورها. النمط: الفلزات توصل وغير الفلزات كالخشب والبلاستيك تعزل.", "النمط: الفلزات توصل."]});
x("61","R",625,'mcq',"Why are lightning conductors made of copper?|لماذا تُصنع مانعات الصواعق من النحاس؟","Does not link conductors to a purpose|لا يربط الموصلات بوظيفتها",{o:sp("Copper is a good conductor, so lightning's electricity can pass through it safely;Copper is a good insulator;Copper is cheap and light;Copper attracts the Sun|النحاس موصل جيد فتمر كهرباء الصاعقة عبره بأمان;النحاس عازل جيد;النحاس رخيص وخفيف;النحاس يجذب الشمس"),ex:["Copper is a good electrical conductor. A lightning conductor gives the electricity from lightning an easy path through the metal instead of through the building.", "Conductor gives electricity a safe path.", "النحاس موصل جيد للكهرباء. ومانعة الصواعق تعطي كهرباء الصاعقة طريقًا سهلًا عبر المعدن بدل المبنى.", "الموصل يعطي الكهرباء مسارًا آمنًا."]});
x("62","K",400,'mcq',"What is distilled water?|ما الماء المقطّر؟","Thinks all water is pure|يظن أن كل الماء نقي",{o:sp("Water that was boiled and the steam cooled down again, with no salts in it;Water with salt added;Sea water;Water from a river|ماء غُلي ثم بُرّد بخاره، وليس فيه أملاح;ماء أُضيف إليه ملح;ماء البحر;ماء من نهر"),ex:["Tap and river water have salts dissolved in them, so they are not pure. Distilled water is pure water that has been boiled and the steam cooled to form liquid water again. It contains no salts.", "Distilled water = pure, no salts.", "ماء الصنبور والنهر فيه أملاح ذائبة فهو غير نقي. أما الماء المقطّر فهو ماء نقي غُلي وبُرّد بخاره ليعود سائلًا ولا أملاح فيه.", "الماء المقطر = نقي بلا أملاح."]});
x("62","A",475,'mcq',"A lamp does not light with distilled water in a circuit, but it lights when salt is dissolved in the water. What does this show?|لا يضيء المصباح مع الماء المقطّر في الدائرة لكنه يضيء بعد إذابة الملح في الماء. ماذا يدل ذلك؟","Thinks pure water conducts electricity|يظن أن الماء النقي يوصل الكهرباء",{o:sp("Salty water conducts electricity;Pure water is a good conductor;Salt is an insulator;Water never conducts|الماء المالح يوصل الكهرباء;الماء النقي موصل جيد;الملح عازل;الماء لا يوصل أبدًا"),ex:["Distilled water has no salts and does not conduct. When salt dissolves in it, the salty water lets electricity pass, so the lamp lights.", "Salts dissolved in water → it conducts.", "الماء المقطّر بلا أملاح ولا يوصل. وعند إذابة الملح فيه يسمح الماء المالح بمرور الكهرباء فيضيء المصباح.", "أملاح ذائبة في الماء ← يوصل."]});
x("62","R",550,'mcq',"Why is it dangerous to swim in the sea during a thunderstorm with lightning?|لماذا من الخطر السباحة في البحر أثناء عاصفة رعدية فيها برق؟","Thinks water is safe in a thunderstorm|يظن أن الماء آمن أثناء العاصفة",{o:sp("Salty sea water and our bodies conduct electricity;Sea water is an insulator;Lightning only hits the land;Water stops electricity|ماء البحر المالح وأجسامنا يوصلان الكهرباء;ماء البحر عازل;البرق يضرب اليابسة فقط;الماء يوقف الكهرباء"),ex:["Sea water has salts dissolved in it, so it conducts electricity. Our bodies contain water with salts, so they are conductors too. Lightning electricity could pass through the water and through us.", "Water with salts and our bodies = conductors.", "يحتوي ماء البحر على أملاح ذائبة فهو يوصل الكهرباء. وأجسامنا فيها ماء وأملاح فهي موصلة أيضًا. قد تمر كهرباء البرق عبر الماء وعبرنا.", "ماء فيه أملاح وأجسامنا = موصلات."]});
x("62","R",625,'mcq',"Why should you never touch a bare electric wire with wet hands?|لماذا يجب ألا تلمس سلكًا كهربائيًا عاريًا بيدين مبللتين؟","Does not know why wet hands are dangerous|لا يعرف لماذا الأيدي المبللة خطرة",{o:sp("Water with salts and our bodies conduct electricity, so you could get a shock;Wet hands are insulators;Water makes wires colder;Wires can only be touched when dry and hot|الماء المالح وأجسامنا يوصلان الكهرباء فقد تتعرض لصعقة;الأيدي المبللة عازلة;الماء يبرّد الأسلاك;يمكن لمس الأسلاك فقط جافة وساخنة"),ex:["Our bodies are about 65% water with salts dissolved in it, so they conduct electricity well. Damp or sweaty fingers conduct even better, so touching a bare wire could give an electric shock.", "Never touch bare wires, especially with damp hands.", "أجسامنا نحو ٦٥٪ ماء فيه أملاح ذائبة فهي توصل الكهرباء جيدًا. والأصابع الرطبة أو المتعرقة توصل أكثر، لذا قد يسبب لمس سلك عارٍ صعقة كهربائية.", "لا تلمس الأسلاك العارية خصوصًا بأيدٍ رطبة."]});
x("63","K",400,'mcq',"What unit measures the strength of a supply of electricity?|ما الوحدة التي تقيس قوة مصدر الكهرباء؟","Does not know the unit of voltage|لا يعرف وحدة الجهد",{o:sp("Volt;Metre;Second;Kilogram|الفولت;المتر;الثانية;الكيلوغرام"),ex:["The strength of a supply of electricity is called voltage and it is measured in volts (V). A cell has 1.5 V, while mains electricity has a much higher voltage.", "Voltage is measured in volts (V).", "تسمى قوة مصدر الكهرباء الجهد ويقاس بالفولت (V). للخلية ١٫٥ فولت أما كهرباء المنزل ففولتيتها أعلى بكثير.", "الجهد يقاس بالفولت (V)."]});
x("63","K",475,'mcq',"Which parts of an electrical appliance that we touch should be made of an insulating material?|أي أجزاء الجهاز الكهربائي التي نلمسها يجب أن تُصنع من مادة عازلة؟","Does not know where insulation is needed|لا يعرف أين يلزم العزل",{o:sp("The outside parts we hold, such as the plastic cover of a plug;The metal pins;The wires inside;The copper centre|الأجزاء الخارجية التي نمسكها مثل غلاف القابس البلاستيكي;الأسنان المعدنية;الأسلاك الداخلية;القلب النحاسي"),ex:["Mains electricity has a high voltage, so the parts we touch must be insulators, like the plastic cover of a plug. The parts inside that carry electricity are made of metal conductors.", "Touch parts = insulators. Inside parts = conductors.", "كهرباء المنزل عالية الجهد لذا يجب أن تكون الأجزاء التي نلمسها عازلة مثل غلاف القابس البلاستيكي. أما الأجزاء الداخلية الناقلة للكهرباء فمن الفلزات الموصلة.", "ما نلمسه = عازل. الداخل = موصل."]});
x("63","A",475,'mcq',"What is the safe way to take a plug out of a socket?|ما الطريقة الآمنة لإخراج القابس من المقبس؟","Pulls the cord instead of the plug|يسحب السلك بدل القابس",{o:sp("Switch off, then grip the plastic plug and pull it out;Pull the cord;Pull with wet hands;Leave the switch on and pull the wire|أطفئ المفتاح ثم أمسك القابس البلاستيكي واسحبه;اسحب السلك;اسحب بأيدٍ مبللة;اترك المفتاح مفتوحًا واسحب السلك"),ex:["Pulling the cord can damage it and leave bare wires. Turn off the switch first, then grip the plug, which is made of insulating plastic, to pull it out.", "Switch off, grip the plug, never pull the cord.", "سحب السلك قد يتلفه ويكشف الأسلاك. أطفئ المفتاح أولًا ثم أمسك القابس المصنوع من البلاستيك العازل واسحبه.", "أطفئ، أمسك القابس، لا تسحب السلك."]});
x("63","A",475,'mcq',"Why are the pins of a plug made of metal but the cover made of plastic?|لماذا أسنان القابس من المعدن وغطاؤه من البلاستيك؟","Does not match materials to functions|لا يربط المواد بوظائفها",{o:sp("Metal conducts electricity to the appliance and plastic insulates our hands;Plastic conducts electricity;Metal is an insulator;It is only for colour|المعدن يوصل الكهرباء إلى الجهاز والبلاستيك يعزل أيدينا;البلاستيك يوصل الكهرباء;المعدن عازل;هذا للّون فقط"),ex:["The metal pins let electricity travel from the wall socket into the appliance. The plastic cover is an insulator, so we can safely hold the plug.", "Pins = conductors. Cover = insulator.", "تسمح الأسنان المعدنية بانتقال الكهرباء من المقبس إلى الجهاز. والغطاء البلاستيكي عازل فنستطيع الإمساك بالقابس بأمان.", "الأسنان = موصلات. الغطاء = عازل."]});
x("63","R",550,'mcq',"A 1.5 V cell is safe to use, but mains electricity is dangerous. What is the main reason?|خلية ١٫٥ فولت آمنة للاستعمال لكن كهرباء المنزل خطرة. ما السبب الرئيس؟","Does not compare voltages|لا يقارن بين الجهود",{o:sp("Mains electricity has a much higher voltage;Cells are insulators;Mains electricity has no wires;Cells have no energy|كهرباء المنزل جهدها أعلى بكثير;الخلايا عازلة;كهرباء المنزل بلا أسلاك;الخلايا بلا طاقة"),ex:["Cells with 1.5 V or 3 V are safe. Mains electricity is 110 V or over 200 V, so it can cause electric shocks, burns and even death. Safety is very important at high voltages.", "Higher voltage = more dangerous.", "الخلايا ذات ١٫٥ أو ٣ فولت آمنة. أما كهرباء المنزل فجهدها ١١٠ أو أكثر من ٢٠٠ فولت فقد تسبب صعقات وحروقًا بل الموت. والسلامة مهمة جدًا مع الجهود العالية.", "جهد أعلى = أخطر."]});
x("63","R",625,'mcq',"Why should you never run an electric wire under a carpet?|لماذا يجب ألا تمرر سلكًا كهربائيًا تحت سجادة؟","Does not predict the danger of worn insulation|لا يتوقع خطر تآكل العزل",{o:sp("Walking on the carpet can wear off the plastic, so bare wires could give a shock or start a fire;Carpets are conductors;Carpets make wires colder;Wires cannot carry electricity under carpets|المشي على السجادة قد يمحو البلاستيك فتنكشف الأسلاك فتسبب صعقة أو حريقًا;السجاد موصل;السجاد يبرّد الأسلاك;الأسلاك لا تنقل الكهرباء تحت السجاد"),ex:["People walking on the carpet wear off the plastic insulation, and bare copper wires can touch each other. Electricity can flow between them and start a fire, or give you a shock if you touch them.", "Damaged insulation = shock or fire risk.", "المشي فوق السجادة يمحو العزل البلاستيكي فتتلامس أسلاك النحاس العارية. قد تسري الكهرباء بينها وتشعل حريقًا أو تصعقك إذا لمستها.", "عزل تالف = خطر صعقة أو حريق."]});
x("64","K",475,'mcq',"What does a switch do in a circuit?|ماذا يفعل المفتاح في الدائرة الكهربائية؟","Thinks a switch makes or stores electricity|يظن أن المفتاح يصنع الكهرباء أو يخزنها",{o:sp("It turns the electric current on or off by closing or opening the circuit;It makes electricity;It stores energy;It makes the lamp brighter|يشغّل التيار الكهربائي أو يوقفه بإغلاق الدائرة أو فتحها;يصنع الكهرباء;يخزّن الطاقة;يجعل المصباح أسطع"),ex:["A switch is a component that opens and closes a circuit. It is like turning a tap on or off. It lets us turn a lamp on and off without breaking wires.", "Switch = on/off for the circuit.", "المفتاح مكوّن يفتح الدائرة ويغلقها. وهو كفتح الصنبور وإغلاقه. يتيح لنا تشغيل المصباح وإطفاءه دون قطع الأسلاك.", "المفتاح = تشغيل/إيقاف للدائرة."]});
x("64","A",475,'mcq',"Sofia closes the switch but the lamp does not light. What should she check first?|أغلقت صوفيا المفتاح لكن المصباح لم يضئ. ماذا تفحص أولًا؟","Does not know to check for a break in the circuit|لا يعرف أن يفحص انقطاع الدائرة",{o:sp("That all the connections are joined so there is no break in the circuit;That the lamp is cold;That the wires are the same colour;That the room is dark|أن كل التوصيلات محكمة فلا يوجد انقطاع في الدائرة;أن المصباح بارد;أن الأسلاك بنفس اللون;أن الغرفة مظلمة"),ex:["A lamp will not light if there is a break in the circuit. If the lamp does not light, check that all the connections are made properly and try again.", "No light? Check for a break in the circuit.", "لا يضيء المصباح إذا وُجد انقطاع في الدائرة. وإذا لم يضئ يجب فحص أن كل التوصيلات صحيحة ثم المحاولة مرة أخرى.", "لا يضيء؟ افحص انقطاع الدائرة."]});
x("64","A",475,'mcq',"Why is a metal paper clip used to make a simple switch?|لماذا يُستخدم مشبك ورق معدني لصنع مفتاح بسيط؟","Does not know why a conductor is needed in a switch|لا يعرف لماذا نحتاج موصلًا في المفتاح",{o:sp("Metal is a conductor, so it completes the circuit when it touches the pin;Metal is an insulator;Metal is lighter than plastic;Metal makes light|المعدن موصل فيكمل الدائرة عند ملامسته الدبوس;المعدن عازل;المعدن أخف من البلاستيك;المعدن يصنع الضوء"),ex:["The paper clip and drawing pins must be metal so that electricity can pass through them when the switch is closed. Lifting the clip breaks the circuit.", "Switch parts that carry current = conductors.", "يجب أن يكون المشبك والدبابيس معدنية لتمر الكهرباء عبرها عند إغلاق المفتاح. ورفع المشبك يقطع الدائرة.", "أجزاء المفتاح الناقلة للتيار = موصلات."]});

x("64","R",625,'mcq',"A circuit has a cell, a lamp and a switch. The switch is open. Predict what the lamp will do and explain why.|دائرة فيها خلية ومصباح ومفتاح. المفتاح مفتوح. توقّع ما سيفعله المصباح وفسّر.","Thinks the lamp lights with an open switch|يظن أن المصباح يضيء مع المفتاح المفتوح",{o:sp("It will stay off because the open switch makes a break in the circuit;It will be bright because the cell is there;It will flicker;It will be dim|سيبقى مطفأً لأن المفتاح المفتوح يصنع انقطاعًا في الدائرة;سيسطع لأن الخلية موجودة;سيومض;سيكون خافتًا"),ex:["Electricity can only flow around a complete circuit. An open switch makes a gap, so the circuit is broken and the lamp does not light. Closing the switch completes the circuit.", "Open switch = break = lamp off.", "لا تسري الكهرباء إلا في دائرة كاملة. المفتاح المفتوح يصنع فجوة فتنقطع الدائرة ولا يضيء المصباح. وإغلاق المفتاح يكمل الدائرة.", "مفتاح مفتوح = انقطاع = المصباح مطفأ."]});
