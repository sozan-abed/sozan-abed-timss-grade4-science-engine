x('str','R',625,'mcq','Which is a limitation of the peach model of the Earth?|\u0645\u0627 \u0645\u062d\u062f\u0648\u062f\u064a\u0629 \u0646\u0645\u0648\u0630\u062c \u0627\u0644\u062e\u0648\u062e\u0629 \u0644\u0644\u0623\u0631\u0636\u061f','Thinks a model must be a perfect copy|\u064a\u0638\u0646 \u0623\u0646 \u0627\u0644\u0646\u0645\u0648\u0630\u062c \u0646\u0633\u062e\u0629 \u0645\u0637\u0627\u0628\u0642\u0629',{img:'peach',o:sp('The stone is solid, but the Earth\'s outer core is liquid;A peach is round;A peach has a skin;A peach can be cut open|\u0627\u0644\u0646\u0648\u0627\u0629 \u0635\u0644\u0628\u0629 \u0628\u064a\u0646\u0645\u0627 \u0627\u0644\u0644\u0628 \u0627\u0644\u062e\u0627\u0631\u062c\u064a \u0633\u0627\u0626\u0644;\u0627\u0644\u062e\u0648\u062e\u0629 \u0645\u0633\u062a\u062f\u064a\u0631\u0629;\u0644\u0644\u062e\u0648\u062e\u0629 \u0642\u0634\u0631\u0629;\u064a\u0645\u0643\u0646 \u0642\u0637\u0639 \u0627\u0644\u062e\u0648\u062e\u0629')});
x('str','A',475,'mcq','Imagine digging down from the surface. Which layer do you reach after the crust?|\u062a\u062e\u064a\u0651\u0644 \u0623\u0646\u0643 \u062a\u062d\u0641\u0631 \u0645\u0646 \u0627\u0644\u0633\u0637\u062d. \u0623\u064a \u0637\u0628\u0642\u0629 \u062a\u0635\u0644 \u0625\u0644\u064a\u0647\u0627 \u0628\u0639\u062f \u0627\u0644\u0642\u0634\u0631\u0629\u061f','Skips the mantle|\u064a\u062a\u062c\u0627\u0647\u0644 \u0627\u0644\u0633\u062a\u0627\u0631',{img:'earth',o:sp('Mantle;Outer core;Inner core;Atmosphere|\u0627\u0644\u0633\u062a\u0627\u0631;\u0627\u0644\u0644\u0628 \u0627\u0644\u062e\u0627\u0631\u062c\u064a;\u0627\u0644\u0644\u0628 \u0627\u0644\u062f\u0627\u062e\u0644\u064a;\u0627\u0644\u063a\u0644\u0627\u0641 \u0627\u0644\u062c\u0648\u064a')});
x('sol','A',475,'mcq','Pictures A and B show the same flag, one at midday and one in the late afternoon. Which picture shows midday?|\u0627\u0644\u0635\u0648\u0631\u062a\u0627\u0646 A \u0648B \u0644\u0644\u0639\u0644\u0645 \u0646\u0641\u0633\u0647 \u0648\u0642\u062a \u0627\u0644\u0638\u0647\u064a\u0631\u0629 \u0648\u0641\u064a \u0623\u0648\u0627\u062e\u0631 \u0627\u0644\u0646\u0647\u0627\u0631. \u0623\u064a\u0647\u0645\u0627 \u0648\u0642\u062a \u0627\u0644\u0638\u0647\u064a\u0631\u0629\u061f','Thinks the long shadow is at midday|\u064a\u0638\u0646 \u0623\u0646 \u0627\u0644\u0638\u0644 \u0627\u0644\u0637\u0648\u064a\u0644 \u0648\u0642\u062a \u0627\u0644\u0638\u0647\u064a\u0631\u0629',{img:'flags',o:sp('B, the short shadow;A, the long shadow;Both;Neither|B \u0627\u0644\u0638\u0644 \u0627\u0644\u0642\u0635\u064a\u0631;A \u0627\u0644\u0638\u0644 \u0627\u0644\u0637\u0648\u064a\u0644;\u0643\u0644\u0627\u0647\u0645\u0627;\u0644\u0627 \u0623\u062d\u062f\u0647\u0645\u0627')});
x('nrg','A',550,'mcq','Circuit 1 has two cells and three lamps. One lamp is removed and the circuit is closed. The two lamps now shine\u2026|\u0627\u0644\u062f\u0627\u0626\u0631\u0629 \u0661 \u0641\u064a\u0647\u0627 \u062e\u0644\u064a\u062a\u0627\u0646 \u0648\u062b\u0644\u0627\u062b\u0629 \u0645\u0635\u0627\u0628\u064a\u062d. \u0623\u064f\u0632\u064a\u0644 \u0645\u0635\u0628\u0627\u062d \u0648\u0623\u064f\u063a\u0644\u0642\u062a \u0627\u0644\u062f\u0627\u0626\u0631\u0629. \u064a\u0636\u064a\u0621 \u0627\u0644\u0645\u0635\u0628\u0627\u062d\u0627\u0646 \u0628\u0634\u0643\u0644\u2026','Thinks removing a lamp dims the rest|\u064a\u0638\u0646 \u0623\u0646 \u0625\u0632\u0627\u0644\u0629 \u0645\u0635\u0628\u0627\u062d \u062a\u062e\u0641\u062a \u0627\u0644\u0628\u0627\u0642\u064a',{img:'circ1',o:sp('Brighter;Dimmer;The same;Not at all|\u0623\u0643\u062b\u0631 \u0633\u0637\u0648\u0639\u064b\u0627;\u0623\u0642\u0644 \u0633\u0637\u0648\u0639\u064b\u0627;\u0646\u0641\u0633\u0647;\u0644\u0627 \u064a\u0636\u064a\u0626\u0627\u0646')});
x('nrg','K',475,'mcq','In Circuit 2, what does the wooden switch do?|\u0641\u064a \u0627\u0644\u062f\u0627\u0626\u0631\u0629 \u0662\u060c \u0645\u0627\u0630\u0627 \u064a\u0641\u0639\u0644 \u0627\u0644\u0645\u0641\u062a\u0627\u062d \u0627\u0644\u062e\u0634\u0628\u064a\u061f','Thinks a switch makes electricity|\u064a\u0638\u0646 \u0623\u0646 \u0627\u0644\u0645\u0641\u062a\u0627\u062d \u064a\u0635\u0646\u0639 \u0627\u0644\u0643\u0647\u0631\u0628\u0627\u0621',{img:'circ2',o:sp('Opens and closes the circuit;Makes electricity;Makes the lamps brighter;Stores energy|\u064a\u0641\u062a\u062d \u0627\u0644\u062f\u0627\u0626\u0631\u0629 \u0648\u064a\u063a\u0644\u0642\u0647\u0627;\u064a\u0635\u0646\u0639 \u0627\u0644\u0643\u0647\u0631\u0628\u0627\u0621;\u064a\u062c\u0639\u0644 \u0627\u0644\u0645\u0635\u0627\u0628\u064a\u062d \u0623\u0633\u0637\u0639;\u064a\u062e\u0632\u0646 \u0627\u0644\u0637\u0627\u0642\u0629')});
x('body','A',475,'mcq','The arm in the picture is lifting. What happens to the muscle on top of the upper arm?|\u0627\u0644\u0630\u0631\u0627\u0639 \u0641\u064a \u0627\u0644\u0635\u0648\u0631\u0629 \u062a\u0631\u062a\u0641\u0639. \u0645\u0627\u0630\u0627 \u064a\u062d\u062f\u062b \u0644\u0644\u0639\u0636\u0644\u0629 \u0627\u0644\u0639\u0644\u0648\u064a\u0629 \u0641\u064a \u0627\u0644\u0630\u0631\u0627\u0639\u061f','Thinks muscles push bones|\u064a\u0638\u0646 \u0623\u0646 \u0627\u0644\u0639\u0636\u0644\u0627\u062a \u062a\u062f\u0641\u0639 \u0627\u0644\u0639\u0638\u0627\u0645',{img:'arm',o:sp('It contracts and gets shorter;It relaxes and gets longer;It pushes the bone;It stays the same|\u062a\u0646\u0642\u0628\u0636 \u0648\u062a\u0642\u0635\u0631;\u062a\u0631\u062a\u062e\u064a \u0648\u062a\u0637\u0648\u0644;\u062a\u062f\u0641\u0639 \u0627\u0644\u0639\u0638\u0645;\u0644\u0627 \u062a\u062a\u063a\u064a\u0631')});
x('nrg','R',550,'exp','Both circuits use the same two cells. Circuit 1 has three lamps, Circuit 2 has two. Predict which lamps are brighter and explain why.|\u0627\u0644\u062f\u0627\u0626\u0631\u062a\u0627\u0646 \u062a\u0633\u062a\u062e\u062f\u0645\u0627\u0646 \u0627\u0644\u062e\u0644\u064a\u062a\u064a\u0646 \u0646\u0641\u0633\u064a\u0647\u0645\u0627. \u0627\u0644\u0623\u0648\u0644\u0649 \u0641\u064a\u0647\u0627 \u062b\u0644\u0627\u062b\u0629 \u0645\u0635\u0627\u0628\u064a\u062d \u0648\u0627\u0644\u062b\u0627\u0646\u064a\u0629 \u0645\u0635\u0628\u0627\u062d\u0627\u0646. \u062a\u0648\u0642\u0651\u0639 \u0623\u064a\u0647\u0645\u0627 \u0623\u0633\u0637\u0639 \u0648\u0641\u0633\u0651\u0631.','Thinks more lamps means more light|\u064a\u0638\u0646 \u0623\u0646 \u0645\u0635\u0627\u0628\u064a\u062d \u0623\u0643\u062b\u0631 \u062a\u0639\u0646\u064a \u0636\u0648\u0621\u064b\u0627 \u0623\u0643\u062b\u0631',{img:'circs',kw:'2,two,second,\u0627\u0644\u062b\u0627\u0646\u064a\u0629,\u0662;fewer,less,share,energy,\u0623\u0642\u0644,\u0637\u0627\u0642\u0629,\u062a\u062a\u0642\u0627\u0633\u0645',mod:'Circuit 2 is brighter: the cells share their energy between fewer lamps.|\u0627\u0644\u062f\u0627\u0626\u0631\u0629 \u0662 \u0623\u0633\u0637\u0639 \u0644\u0623\u0646 \u0627\u0644\u062e\u0644\u0627\u064a\u0627 \u062a\u0648\u0632\u0651\u0639 \u0637\u0627\u0642\u062a\u0647\u0627 \u0639\u0644\u0649 \u0645\u0635\u0627\u0628\u064a\u062d \u0623\u0642\u0644.'});

x("body","A",475,'mcq',"A runner's heart beats faster during a race. Why?|ينبض قلب العدّاء أسرع أثناء السباق. لماذا؟","Thinks a fast heartbeat means the heart is tired|يظن أن النبض السريع يعني أن القلب متعب",{o:sp("His muscles need more oxygen so the heart pumps more blood;The heart is tired;The lungs push the heart;His blood is cold|عضلاته تحتاج أكسجينًا أكثر فيضخ القلب دمًا أكثر;القلب متعب;الرئتان تدفعان القلب;دمه بارد")});

const EX={
0:["The skull is a hard bone helmet made of joined plates. It sits around the brain and protects it from knocks. The rib cage protects the heart and lungs, the spine protects the spinal cord, and arm bones help us hold and move things.","Skull = helmet for the brain. Ribs = cage for the heart and lungs.","الجمجمة عظمة صلبة تشبه الخوذة وتتكوّن من صفائح متصلة، وهي تحيط بالدماغ وتحميه من الصدمات. أما القفص الصدري فيحمي القلب والرئتين، والعمود الفقري يحمي الحبل الشوكي، وعظام الذراع تساعدنا على الإمساك والحركة.","الجمجمة = خوذة الدماغ. الأضلاع = قفص القلب والرئتين."],
1:["The heart is a strong muscle that works like a pump. It squeezes and pushes blood through tubes called blood vessels, carrying oxygen and food to every part of the body. The lungs bring in oxygen (they move because we breathe, not because they pump blood). The stomach digests food and the brain controls the body.","Heart = pump. Lungs = air bags. Stomach = food mixer. Brain = boss.","القلب عضلة قوية تعمل مثل المضخة، فهي تنقبض وتدفع الدم في أنابيب تسمى الأوعية الدموية ليوصل الأكسجين والغذاء إلى كل الجسم. الرئتان تُدخلان الأكسجين (وتتحركان بسبب التنفس وليس لأنهما تضخان الدم). المعدة تهضم الطعام والدماغ يتحكم في الجسم.","القلب = مضخة. الرئتان = أكياس الهواء. المعدة = خلاط الطعام. الدماغ = المدير."],
2:["Roots have tiny root hairs that soak up water and minerals from the soil, and they also hold the plant in place. Leaves make food, the stem carries water up and food around, and the flower makes seeds. Leaves do not drink water like mouths.","Roots = straws + anchor. Leaves = kitchen. Stem = pipe. Flower = seed maker.","للجذور شعيرات صغيرة جدًا تمتص الماء والأملاح من التربة، وهي تثبّت النبات في مكانه أيضًا. الأوراق تصنع الغذاء، والساق تنقل الماء إلى أعلى والغذاء إلى الأجزاء الأخرى، والزهرة تصنع البذور. الأوراق لا تشرب الماء مثل الفم.","الجذور = ماصّات + مرساة. الأوراق = مطبخ. الساق = أنبوب. الزهرة = مصنع البذور."],
3:["Germination is when a seed starts to sprout. The next stage is seedling growth: a small plant with roots and first leaves. The full order is: seed → germination → seedling growth → adult plant → flowers (pollination) → fruit and seeds → seed dispersal.","Seed sprouts (germination), then it grows (seedling). Flowers and fruit come later.","الإنبات هو بدء البذرة بالنمو والتبرعم. والمرحلة التي تليه مباشرة هي نمو الشتلة: نبتة صغيرة لها جذور وأوراق أولى. الترتيب الكامل: بذرة ← إنبات ← نمو الشتلة ← نبات كبير ← أزهار (تلقيح) ← ثمرة وبذور ← انتشار البذور.","تتبرعم البذرة (إنبات) ثم تنمو (شتلة). الأزهار والثمار تأتي لاحقًا."],
4:["The fluffy hairs act like a parachute, so the lightest breeze can lift the seed and carry it far away. This is wind dispersal (like dandelion seeds). Water-dispersed seeds float (like coconuts), animal-dispersed seeds have hooks or are eaten, and exploding seeds are inside pods that burst open.","Look at the seed's structure to find how it travels: fluff or wings = wind, hooks = fur, floaty = water, pods = exploding.","الشعيرات الخفيفة تعمل مثل المظلة، فيرفع النسيم الخفيف البذرة وينقلها بعيدًا. هذا انتشار بالرياح (مثل بذور الهندباء). البذور التي تنتشر بالماء تطفو (مثل جوز الهند)، والتي تنتشر بالحيوانات لها خطاطيف أو تؤكل، والبذور المنفجرة توجد داخل قرون تنفتح فجأة.","انظر إلى تركيب البذرة لتعرف كيف تنتقل: زغب أو أجنحة = رياح، خطاطيف = فرو، تطفو = ماء، قرون = انفجار."],
5:["Eye colour is inherited: it is passed from parents to children through genes. A scar, a haircut and a broken branch are changes that happen during life (acquired changes). They are not in the genes, so they are not passed on.","Inherited = born with it from parents. Acquired = happens to you during life.","لون العينين صفة موروثة: تنتقل من الآباء إلى الأبناء عبر الجينات. أما الندبة وقصّة الشعر والغصن المكسور فهي تغيّرات تحدث أثناء الحياة (مكتسبة)، وليست في الجينات لذلك لا تنتقل إلى الأبناء.","موروث = تولد به من والديك. مكتسب = يحدث لك أثناء الحياة."],
6:["Losing a tail in an accident is an acquired change. It does not change the genes in the parent's body that make the puppies, so the puppies are born with normal tails. Only inherited traits are passed on.","Accidents and injuries are never inherited. Puppies copy the genes, not the accident.","فقدان الذيل في حادث تغيّر مكتسب، ولا يغيّر الجينات التي تنتقل إلى الصغار، لذلك يولد الجراء بذيول عادية. الصفات الموروثة فقط هي التي تنتقل.","الحوادث والإصابات لا تُورَّث. الصغار يرثون الجينات وليس الحادث."],
7:["The biceps contracts: it gets shorter and fatter and pulls the lower arm bone up. Muscles can only pull, never push. They work in pairs: the triceps on the back of the arm pulls the arm straight again.","Muscles PULL, they never push. Biceps bends the arm, triceps straightens it.","العضلة ذات الرأسين تنقبض فتصبح أقصر وأسمك وتشد عظمة الساعد إلى أعلى. العضلات تشدّ فقط ولا تدفع أبدًا. وهي تعمل في أزواج: العضلة ثلاثية الرؤوس في خلف الذراع تشدّ الذراع لتستقيم.","العضلات تشدّ ولا تدفع. ذات الرأسين تثني الذراع وثلاثية الرؤوس تفرده."],
8:["In a food chain, the arrows show who eats whom and the direction energy flows. Grass is the producer because it makes its own food using sunlight. The first animal that eats the producer is the primary consumer, which is the grasshopper. The frog is the secondary consumer and the snake is the next consumer.","Primary consumer = the first eater of the plant. Plants are producers, never consumers.","في السلسلة الغذائية تبيّن الأسهم من يأكل من واتجاه انتقال الطاقة. العشب منتج لأنه يصنع غذاءه بنفسه بالاستعانة بضوء الشمس. أول حيوان يأكل المنتج هو المستهلك الأول وهو الجندب. الضفدع مستهلك ثانٍ والثعبان المستهلك التالي.","المستهلك الأول = أول من يأكل النبات. النباتات منتجات وليست مستهلكات."],
9:["Frogs eat grasshoppers. When frogs disappear, fewer grasshoppers are eaten, so the number of grasshoppers goes up first. Later they may eat too much grass and run out of food. Removing a predator helps its prey in the short term.","No predator = more prey (at first). Every living thing in a chain affects the others.","الضفادع تأكل الجنادب. عند اختفاء الضفادع يقلّ عدد الجنادب المأكولة، فيزداد عددها أولًا. وبعد ذلك قد تأكل الكثير من العشب فينفد غذاؤها. إزالة المفترس تفيد فريسته على المدى القصير.","لا مفترس = فريسة أكثر (في البداية). كل كائن في السلسلة يؤثر في الآخرين."],
10:["In a fair test we change only ONE thing (here, the amount of light) and keep everything else the same, like water, soil, pot and type of plant. Then any difference in growth must be caused by light. The final height is what we measure, so it is the result, not something we keep the same.","Fair test: change ONE thing, keep the rest the same, measure the result.","في الاختبار العادل نغيّر شيئًا واحدًا فقط (هنا كمية الضوء) ونُبقي كل شيء آخر ثابتًا مثل الماء والتربة والإناء ونوع النبات. فإذا اختلف النمو فالسبب هو الضوء. أما الطول النهائي فهو ما نقيسه أي النتيجة، فلا نثبّته.","الاختبار العادل: غيّر شيئًا واحدًا، ثبّت الباقي، وقِس النتيجة."],
11:["Lizards and birds need the same food. When insects become scarce, they compete for what is left. With less food, both groups may get smaller in number. Living things that share the same food compete when it is limited.","Same food + less food = competition = fewer animals.","السحالي والطيور تحتاج إلى الغذاء نفسه. عندما تقل الحشرات تتنافس على ما تبقى منها، ومع قلة الغذاء قد ينقص عدد الفريقين. الكائنات التي تتشارك الغذاء تتنافس عندما يكون محدودًا.","غذاء مشترك + غذاء قليل = تنافس = نقص في الأعداد."],
12:["Burning wood is a chemical change: it makes new substances such as ash, smoke and gases, and you cannot turn them back into wood. Melting ice, boiling water and freezing juice are physical changes: it is the same substance, and the change can be reversed by cooling or heating.","Burn, rust, cook, rot = cannot go back. Melt, freeze, boil, dissolve = can go back.","حرق الخشب تغيّر كيميائي: تتكوّن مواد جديدة مثل الرماد والدخان والغازات ولا يمكن إعادتها خشبًا. أما انصهار الثلج وغليان الماء وتجمّد العصير فهي تغيّرات فيزيائية: المادة نفسها ويمكن عكس التغيّر بالتبريد أو التسخين.","حرق، صدأ، طبخ، تعفّن = لا رجوع. انصهار، تجمّد، غليان، ذوبان = يمكن الرجوع."],
13:["Two things speed up dissolving: heat and stirring. Hot water has fast-moving particles that break the sugar apart quickly, and stirring brings fresh water to the sugar. Hot AND stirred together is fastest. Cold or not stirred is slower.","Hot + stir = fastest dissolving. Check ALL the factors, not just one.","هناك عاملان يسرّعان الذوبان: الحرارة والتحريك. الماء الساخن تتحرك جزيئاته بسرعة فتفكّك السكر بسرعة، والتحريك يجلب ماءً جديدًا إلى السكر. ساخن مع التحريك هو الأسرع، أما البارد أو بدون تحريك فأبطأ.","حرارة + تحريك = أسرع ذوبان. انتبه لكل العوامل وليس لعامل واحد."],
14:["Look at the pattern in the data: as the temperature goes up (20, 40, 60 °C) the time to dissolve goes down (60, 35, 20 s). Less time means faster. So higher temperature dissolves sugar faster. A good conclusion always matches the numbers.","Read the trend: when one number goes UP and the other goes DOWN, say what that means.","انظر إلى النمط في البيانات: كلما ارتفعت الحرارة (٢٠ ثم ٤٠ ثم ٦٠°م) قلّ زمن الذوبان (٦٠ ثم ٣٥ ثم ٢٠ ثانية). والزمن الأقل يعني ذوبانًا أسرع. إذن الحرارة الأعلى تذيب السكر أسرع. والاستنتاج الجيد يطابق الأرقام دائمًا.","اقرأ الاتجاه: عندما يزداد رقم وينقص الآخر، قل ماذا يعني ذلك."],
15:["A magnet attracts iron, which is a magnetic metal, but sand is not magnetic. So a magnet pulls the nails out. Filter paper separates solids from liquids, and heat and spoons do not separate iron from sand.","Magnets pick up magnetic things: iron, steel, nickel, cobalt.","المغناطيس يجذب الحديد لأنه فلز مغناطيسي، أما الرمل فليس مغناطيسيًا، لذلك يسحب المغناطيس المسامير. ورق الترشيح يفصل المواد الصلبة عن السوائل، والحرارة والملعقة لا تفصلان الحديد عن الرمل.","المغناطيس يلتقط المواد المغناطيسية: الحديد والفولاذ والنيكل والكوبالت."],
16:["When salt dissolves, it breaks into particles too tiny to see, so a sieve cannot catch it. If you heat the salty water, the water evaporates into the air and the salt is left behind as crystals. A magnet does nothing because salt is not magnetic.","Dissolved solid + liquid? EVAPORATE the liquid and the solid stays.","عندما يذوب الملح يتفتت إلى جزيئات صغيرة جدًا لا ترى، فلا يستطيع المنخل حجزها. وإذا سخّنت الماء المالح يتبخر الماء ويبقى الملح على شكل بلورات. المغناطيس لا يفيد لأن الملح ليس مغناطيسيًا.","مادة مذابة في سائل؟ بخّر السائل فتبقى المادة الصلبة."],
17:["Plan the easiest step first. A magnet removes the iron filings. Then a sieve separates the big gravel from the small sand. Adding water or evaporating is not needed because nothing is dissolved.","Pick the method that matches each property: magnetic → magnet, size → sieve, dissolved → evaporate.","خطّط بالبدء بأسهل خطوة. المغناطيس يزيل برادة الحديد، ثم يفصل المنخل الحصى الكبير عن الرمل الصغير. لا حاجة للماء أو التبخير لأن شيئًا لم يذب.","اختر الطريقة حسب الخاصية: مغناطيسي ← مغناطيس، الحجم ← منخل، مذاب ← تبخير."],
18:["A seesaw is a bar that turns around a fixed point called the fulcrum. That makes it a lever. A pulley uses a wheel and rope, a gear has teeth, and a ramp is a slope.","Lever = bar + fulcrum (seesaw, crowbar, scissors).","الأرجوحة المتوازنة قضيب يدور حول نقطة ثابتة تسمى نقطة الارتكاز، وهذا هو تعريف الرافعة. البكرة تستخدم عجلة وحبلًا، والترس له أسنان، والمستوى المائل سطح منحدر.","رافعة = قضيب + نقطة ارتكاز (أرجوحة، عتلة، مقص)."],
19:["A longer ramp is a gentler slope. The box travels a longer distance, so you need a smaller push. The job is not free: you push less but for farther. A ramp never removes the effort completely.","Longer ramp = smaller force, bigger distance.","المنحدر الأطول أقل انحدارًا. يقطع الصندوق مسافة أطول فتحتاج إلى دفع أصغر. ليس الأمر مجانيًا: تدفع بقوة أقل لكن لمسافة أبعد. والمنحدر لا يلغي الجهد تمامًا.","منحدر أطول = قوة أصغر ومسافة أكبر."],
20:["Plastic is a poor conductor of heat, so it is a good thermal insulator and keeps heat in or out slowly. Copper, iron and aluminium are metals and conduct heat very well, so they are bad insulators.","Metals conduct heat. Plastic, wood and rubber insulate.","البلاستيك موصل رديء للحرارة لذلك هو عازل حراري جيد ويُبطئ دخول الحرارة أو خروجها. النحاس والحديد والألمنيوم فلزات توصل الحرارة جيدًا فهي عوازل سيئة.","الفلزات توصل الحرارة. البلاستيك والخشب والمطاط تعزلها."],
21:["Each cell pushes the electric current around the circuit. With two cells there is a bigger push, more current flows, and the bulb shines brighter. Cells do not share energy and dim.","More cells = bigger push = brighter bulb.","كل خلية تدفع التيار الكهربائي في الدائرة. مع خليتين يكون الدفع أكبر ويمر تيار أكثر فيصبح المصباح أسطع. والخلايا لا تتقاسم الطاقة فتخفت.","خلايا أكثر = دفع أكبر = مصباح أسطع."],
22:["To find out if the bulb is the problem, change only the bulb: put a bulb that works into the same circuit. If it lights, the old bulb was broken. If you changed other things, you could not tell which one mattered.","Test one part at a time by swapping in a part you know works.","لمعرفة هل المشكلة في المصباح غيّر المصباح وحده: ضع مصباحًا سليمًا في الدائرة نفسها. فإذا أضاء كان المصباح القديم تالفًا. أما تغيير أشياء أخرى فلا يخبرك أيها السبب.","اختبر جزءًا واحدًا كل مرة باستبداله بجزء سليم."],
23:["The Earth gets hotter the deeper you go. The inner core is the hottest, about as hot as the surface of the Sun, and it is solid because of the huge pressure. The crust is the coolest layer.","Deeper = hotter. Order: crust → mantle → outer core → inner core.","تزداد حرارة الأرض كلما تعمقنا. اللب الداخلي هو الأسخن وحرارته تقارب حرارة سطح الشمس، وهو صلب بسبب الضغط الهائل. القشرة هي الأبرد.","أعمق = أسخن. الترتيب: قشرة ← ستار ← لب خارجي ← لب داخلي."],
24:["Shells form in the sea, so a shell fossil means sea animals once lived there. The land was once under the sea and was later pushed up by slow movements of the Earth. Fossils are clues to past places.","Sea fossil on land = it was once under the sea.","تتكوّن الأصداف في البحر، فوجود حفرية صدفة يعني أن حيوانات بحرية عاشت هناك. كان المكان تحت البحر ثم ارتفع بحركات الأرض البطيئة. الحفريات أدلة على البيئات القديمة.","حفرية بحرية على اليابسة = كان المكان تحت البحر."],
25:["Weather is what happens on one day or at one time. Climate is the average weather of a place over many years. One hot day does not make a hot climate.","Weather = today. Climate = the long-term pattern.","الطقس ما يحدث في يوم أو وقت معيّن، والمناخ هو متوسط الطقس في مكان ما عبر سنوات كثيرة. يوم حار واحد لا يجعل المناخ حارًا.","الطقس = اليوم. المناخ = النمط طويل المدى."],
26:["The Earth spins (rotates) on its axis once every 24 hours. The side facing the Sun has day and the side facing away has night. The Sun only seems to move. Orbiting the Sun takes a whole year and gives us the year and seasons.","Rotation = day and night. Revolution (orbit) = one year.","تدور الأرض حول محورها دورة كل ٢٤ ساعة. الجانب المواجه للشمس يكون نهارًا والجانب المعاكس ليلًا. الشمس تبدو متحركة فقط. أما دوران الأرض حول الشمس فيستغرق سنة كاملة وينتج السنة والفصول.","الدوران حول المحور = ليل ونهار. الدوران حول الشمس = سنة."],
27:["The Moon only reflects light from the Sun. The Sun always lights one half of the Moon, and as the Moon orbits Earth we see more or less of that lit half, so the Moon has phases. If it made its own light it would always look full. Being round, far or white does not prove anything.","Moon = mirror, not lamp. Phases show reflected sunlight.","القمر يعكس ضوء الشمس فقط. الشمس تضيء دائمًا نصفه، ومع دورانه حول الأرض نرى جزءًا أكبر أو أصغر من النصف المضاء فتظهر أطوار القمر. ولو صنع ضوءه بنفسه لبدا مكتملًا دائمًا. كونه كرويًا أو بعيدًا أو أبيض لا يثبت شيئًا.","القمر مرآة وليس مصباحًا. الأطوار تدل على ضوء الشمس المنعكس."],
28:["Wind is renewable because it keeps blowing and is replaced naturally. Coal, oil and natural gas are fossil fuels that took millions of years to form from dead plants and animals, so they will run out.","Renewable: sun, wind, water. Non-renewable: coal, oil, gas.","الرياح مورد متجدد لأنها تستمر في الهبوب وتتجدد طبيعيًا. أما الفحم والنفط والغاز الطبيعي فهي وقود أحفوري استغرق تكوّنه ملايين السنين من نباتات وحيوانات ميتة، لذلك سينفد.","متجدد: شمس ورياح وماء. غير متجدد: فحم ونفط وغاز."],
29:["Solar panels use sunlight, which will not run out, and they make little pollution. Coal may be cheaper today, but it will run out and pollutes the air. Good long-term choices protect the future.","For long-term choices, think: will it last, and is it safe for the future?","الألواح الشمسية تستخدم ضوء الشمس الذي لن ينفد وتسبب تلوثًا قليلًا. الفحم قد يكون أرخص اليوم لكنه سينفد ويلوّث الهواء. الخيارات الجيدة طويلة المدى تحمي المستقبل.","في القرارات بعيدة المدى اسأل: هل يدوم؟ وهل هو آمن للمستقبل؟"],
30:["The heart is a muscle in the chest, a little to the left. It pumps blood through the body, carrying oxygen and food. The lungs are the two big organs beside it for breathing.","Heart = pump in the middle of the chest.","القلب عضلة في الصدر مائلة قليلًا إلى اليسار، يضخ الدم في الجسم حاملًا الأكسجين والغذاء. الرئتان هما العضوان الكبيران بجانبه للتنفس.","القلب = مضخة في وسط الصدر."],
31:["The lungs are the two organs in the chest that we breathe with. When we breathe in, oxygen goes into the lungs and passes into the blood. The stomach is for digesting food, not breathing.","Lungs = breathing. Stomach = digestion.","الرئتان عضوان في الصدر نتنفس بهما. عند الشهيق يدخل الأكسجين إلى الرئتين وينتقل إلى الدم. المعدة للهضم وليست للتنفس.","الرئتان = التنفس. المعدة = الهضم."],
32:["The brain is the control centre. It sends and receives messages along nerves to control thinking, feeling and moving. It sits in the head inside the skull. The heart only pumps blood.","Brain = control centre. Heart = pump.","الدماغ هو مركز التحكم، يرسل ويستقبل الرسائل عبر الأعصاب فيتحكم في التفكير والشعور والحركة. يقع في الرأس داخل الجمجمة. أما القلب فيضخ الدم فقط.","الدماغ = مركز التحكم. القلب = مضخة."],
33:["Leaves make the plant's food by photosynthesis. They use sunlight, water and carbon dioxide to make sugar and oxygen. Their green chlorophyll catches the light. Roots take in water and do not make food.","Leaf = food factory (photosynthesis).","تصنع الأوراق غذاء النبات بالبناء الضوئي. تستخدم ضوء الشمس والماء وثاني أكسيد الكربون لصنع السكر والأكسجين، وتلتقط الكلوروفيل الأخضر الضوء. الجذور تمتص الماء ولا تصنع الغذاء.","الورقة = مصنع الغذاء (البناء الضوئي)."],
34:["The flower has bright petals, scent and nectar that attract insects. Insects carry pollen from flower to flower, which is pollination. After that the flower can make fruit with seeds. The fruit is not what attracts insects.","Flower attracts insects. Fruit protects the seeds.","للزهرة بتلات زاهية ورائحة ورحيق تجذب الحشرات. تنقل الحشرات حبوب اللقاح من زهرة إلى أخرى وهذا هو التلقيح. بعد ذلك تكوّن الزهرة ثمرة فيها بذور. الثمرة ليست ما يجذب الحشرات.","الزهرة تجذب الحشرات. الثمرة تحمي البذور."],
35:["The outer core is made of liquid iron and nickel. The inner core is also iron and nickel but solid because of the huge pressure. The mantle is hot rock that moves very slowly.","Outer core = liquid. Inner core = solid.","اللب الخارجي مكوّن من حديد ونيكل سائلين. أما اللب الداخلي فهو من الحديد والنيكل أيضًا لكنه صلب بسبب الضغط الهائل. والستار صخور ساخنة تتحرك ببطء شديد.","اللب الخارجي = سائل. اللب الداخلي = صلب."],
36:["The crust is the thin, solid, rocky outer layer of the Earth. We live on it. It is very thin compared with the mantle underneath it.","Crust = the thin skin we live on.","القشرة هي الطبقة الخارجية الصخرية الصلبة الرقيقة للأرض ونحن نعيش عليها. وهي رقيقة جدًا مقارنة بالستار الذي تحتها.","القشرة = الجلد الرقيق الذي نعيش عليه."],
37:["Plants make their food in their leaves by photosynthesis. Leaves have green chlorophyll that catches sunlight. Roots absorb water and the stem carries it.","Leaves = where food is made.","تصنع النباتات غذاءها في أوراقها بالبناء الضوئي. في الأوراق الكلوروفيل الأخضر الذي يلتقط ضوء الشمس. الجذور تمتص الماء والساق تنقله.","الأوراق = مكان صنع الغذاء."],
38:["Mercury is the closest planet to the Sun. The order is Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.","My Very Educated Mother Just Served Us Noodles (M-V-E-M-J-S-U-N).","عطارد هو أقرب كوكب إلى الشمس. الترتيب: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون.","ابدأ بالأقرب: عطارد أولًا ثم الزهرة ثم الأرض وهكذا."],
39:["Evaporation is when liquid water turns into a gas called water vapour. Heat makes it faster. The opposite is condensation, when gas cools and turns back into liquid.","Evaporation: liquid → gas. Condensation: gas → liquid.","التبخر هو تحول الماء السائل إلى غاز يسمى بخار الماء، والحرارة تجعله أسرع. عكسه التكاثف: عندما يبرد الغاز ويعود سائلًا.","تبخر: سائل ← غاز. تكاثف: غاز ← سائل."],
40:["A predator hunts and eats other animals. The animal that is hunted is the prey. A lion is a predator and a zebra is its prey.","Predator = hunter. Prey = hunted.","المفترس حيوان يصطاد حيوانات أخرى ويأكلها، والحيوان الذي يُصطاد هو الفريسة. الأسد مفترس والحمار الوحشي فريسته.","المفترس = الصياد. الفريسة = المصيد."],
41:["An insulator does not let electricity pass through. Rubber, plastic, wood and glass are insulators. Wires are covered in plastic to keep us safe. A conductor, such as copper, lets electricity pass.","Insulator = stops. Conductor = carries.","العازل مادة لا تسمح بمرور الكهرباء، مثل المطاط والبلاستيك والخشب والزجاج. تُغطى الأسلاك بالبلاستيك لحمايتنا. أما الموصل مثل النحاس فيسمح بمرور الكهرباء.","العازل = يمنع. الموصل = ينقل."],
42:["Climate is the average weather of a place over many years, such as a desert climate that is hot and dry. Weather is what happens today.","Climate = long term. Weather = short term.","المناخ هو متوسط الطقس في مكان ما عبر سنوات طويلة، مثل المناخ الصحراوي الحار والجاف. أما الطقس فهو ما يحدث اليوم.","المناخ = طويل المدى. الطقس = قصير المدى."],
43:["The skull is the hard bone helmet around the head and it protects the brain, the soft control centre of the body.","Skull protects brain; ribs protect heart and lungs.","الجمجمة خوذة عظمية صلبة حول الرأس تحمي الدماغ، وهو مركز التحكم الرخو في الجسم.","الجمجمة تحمي الدماغ، والأضلاع تحمي القلب والرئتين."],
44:["The life cycle of a flowering plant goes in this order: 1 Seed, 2 Germination (the seed sprouts), 3 Growth, 4 Flowering, 5 Fruit and seeds. The new seeds start the cycle again.","Seed → Sprout → Grow → Flower → Fruit and seeds, then repeat.","تسير دورة حياة النبات الزهري بهذا الترتيب: ١ بذرة، ٢ إنبات (تتبرعم البذرة)، ٣ نمو، ٤ إزهار، ٥ ثمرة وبذور. والبذور الجديدة تبدأ الدورة من جديد.","بذرة ← إنبات ← نمو ← إزهار ← ثمرة وبذور ثم تتكرر."],
45:["Match the method to the property. Iron filings and paper clips are magnetic, so use a magnet. Sand and gravel are different sizes, so use a sieve. Salt dissolved in water cannot be sieved, so use evaporation.","Magnetic → magnet. Different size → sieve. Dissolved → evaporation.","اختر الطريقة حسب الخاصية. برادة الحديد ومشابك الورق مغناطيسية فنستخدم المغناطيس. الرمل والحصى مختلفا الحجم فنستخدم المنخل. الملح المذاب في الماء لا يُنخل فنستخدم التبخير.","مغناطيسي ← مغناطيس. حجم مختلف ← منخل. مذاب ← تبخير."],
46:["Copper and iron are metals and let electricity flow, so they are conductors. Plastic, wood and rubber do not let electricity flow, so they are insulators. Not all metals insulate.","Metals conduct. Plastic, wood, rubber insulate.","النحاس والحديد فلزات تسمح بمرور الكهرباء فهي موصلات. البلاستيك والخشب والمطاط لا تسمح بمرورها فهي عوازل. الفلزات لا تعزل أبدًا.","الفلزات توصل. البلاستيك والخشب والمطاط تعزل."],
47:["Wind, sunlight and timber (trees can be planted again) are renewable because they are replaced naturally or quickly. Coal and oil took millions of years to form and will run out, so they are non-renewable. Fuels do not renew quickly.","Renewable = replaced soon. Non-renewable = will run out.","الرياح وضوء الشمس والأخشاب (يمكن زراعة الأشجار من جديد) موارد متجددة لأنها تتعوض طبيعيًا أو بسرعة. الفحم والنفط استغرقا ملايين السنين ليتكوّنا وسينفدان، فهما غير متجددين. الوقود لا يتجدد بسرعة.","متجدد = يعوَّض قريبًا. غير متجدد = سينفد."],
48:["A food chain starts with a producer, the plant that makes its own food. Then comes the animal that eats the plant, then the animals that eat it. Order: Grass → Grasshopper → Frog → Snake. The top predator is last.","Start with the plant (sunlight's energy), end with the top predator.","تبدأ السلسلة الغذائية بالمنتج وهو النبات الذي يصنع غذاءه. ثم الحيوان الذي يأكل النبات ثم الحيوانات التي تأكله. الترتيب: عشب ← جندب ← ضفدع ← ثعبان. والمفترس الأعلى في النهاية.","ابدأ بالنبات وانتهِ بالمفترس الأعلى."],
49:["A fair test changes only one thing. We want to test water temperature, so beaker A and B must have different temperatures. Stirring and the form of sugar (cube or powder) must be the same, otherwise we would not know what caused the difference.","One variable changes. Everything else stays the same.","الاختبار العادل يغيّر شيئًا واحدًا فقط. نريد اختبار حرارة الماء لذلك يجب أن تختلف حرارة الكأسين A وB. أما التحريك وشكل السكر (مكعب أو مسحوق) فيجب أن يتطابقا وإلا لن نعرف سبب الفرق.","متغير واحد يتغير. الباقي يبقى ثابتًا."],
50:["On a ramp, a longer slope means a smaller push. With a 1 m ramp you push 100 N. With 4 m the push is about 25 N. So the ramp must be 4 m or longer. The work is the same, but force is spread over a longer distance.","Longer ramp = less force (100 N ÷ length).","كلما طال المنحدر قلّت قوة الدفع. بمنحدر ١ م تدفع ١٠٠ نيوتن، وبمنحدر ٤ م تصبح القوة نحو ٢٥ نيوتن. لذلك يجب أن يكون المنحدر ٤ م أو أكثر. الشغل نفسه لكن القوة تتوزع على مسافة أطول.","منحدر أطول = قوة أقل (١٠٠ ÷ الطول)."],
51:["More cells give a bigger push to the current, so the bulb is brighter. With 3 or 4 cells the brightness reaches 3 or more. One or two cells are too weak. Cells do not dim the bulb.","More cells = brighter bulb.","كلما زاد عدد الخلايا زاد دفع التيار فيصبح المصباح أسطع. مع ٣ أو ٤ خلايا يصل السطوع إلى ٣ أو أكثر. خلية أو خليتان ضعيفتان. الخلايا لا تخفت المصباح.","خلايا أكثر = مصباح أسطع."],
52:["Plant A is taller because leaves need light to make food by photosynthesis. Plant A made more food, so it could grow more. Plant B had water but no light, so it could not make enough food. Plants need light, not only water.","Light + water + air → food. No light, no food, little growth.","النبات A أطول لأن الأوراق تحتاج إلى الضوء لصنع الغذاء بالبناء الضوئي. فصنع A غذاءً أكثر فنما أكثر. أما B فكان عنده ماء لكن بلا ضوء فلم يصنع غذاءً كافيًا. النبات يحتاج الضوء وليس الماء فقط.","ضوء + ماء + هواء ← غذاء. لا ضوء، لا غذاء، نمو قليل."],
53:["Sam is wrong. Melting ice is a physical change. It is still water, no new substance forms, and it can freeze again. A chemical change makes a new substance, like burning wood.","Same substance + reversible = physical change. New substance = chemical change.","سام مخطئ. انصهار الثلج تغيّر فيزيائي، فهو ما زال ماءً ولا تتكوّن مادة جديدة ويمكن أن يتجمد ثانية. التغيّر الكيميائي ينتج مادة جديدة مثل حرق الخشب.","نفس المادة + قابل للعكس = تغيّر فيزيائي. مادة جديدة = تغيّر كيميائي."],
54:["Seasons happen because the Earth is tilted on its axis while it orbits the Sun. As it moves around the Sun, different parts lean toward the Sun at different times, so sunlight is stronger and days are longer in summer and weaker in winter. It is not because Earth is nearer the Sun.","Tilt + orbit = seasons. Distance is NOT the reason.","تحدث الفصول لأن الأرض مائلة على محورها وهي تدور حول الشمس. وبحركتها تميل أجزاء مختلفة نحو الشمس في أوقات مختلفة فيكون ضوء الشمس أقوى والنهار أطول في الصيف وأضعف في الشتاء. ليس السبب أن الأرض أقرب إلى الشمس.","ميل + دوران حول الشمس = فصول. البعد ليس السبب."],
55:["Yes, a lever makes work easier. A seesaw or crowbar lets a small effort move a big load. The trade-off is that you must move your end over a longer distance. A machine makes the job easier but does not remove the effort.","Lever: less effort, more distance.","نعم، الرافعة تسهّل العمل. الأرجوحة أو العتلة تسمح بجهد صغير لتحريك حمل كبير. المقابل أنك تحرك طرفك مسافة أطول. الآلة تسهّل العمل لكنها لا تلغي الجهد.","الرافعة: جهد أقل ومسافة أكبر."],
56:["Use the numbers in the graph: the plant with 6 hours of light is 11 cm tall and the plant with 0 hours is only 2 cm. So more hours of light give taller plants. A good answer states the pattern and uses numbers as evidence.","Conclusion = pattern + numbers from the data.","استعن بالأرقام في المخطط: النبات الذي أخذ ٦ ساعات ضوء ارتفاعه ١١ سم والذي أخذ ٠ ساعة ٢ سم فقط. إذن ساعات الضوء الأكثر تعطي نباتًا أطول. الإجابة الجيدة تذكر النمط وتستشهد بالأرقام.","الاستنتاج = النمط + أرقام من البيانات."],
57:["Read the tallest bar. The 6-hour bar is the highest on the graph, so 6 hours of light gave the tallest plant. Always check the label under each bar.","Tallest bar = biggest value. Read the label carefully.","اقرأ أطول عمود. عمود ٦ ساعات هو الأعلى في المخطط، لذلك أعطت ٦ ساعات ضوء أطول نبات. تأكد دائمًا من الاسم تحت كل عمود.","أطول عمود = أكبر قيمة. اقرأ الاسم بدقة."],
58:["Find both bars and subtract. The 4-hour plant is 8 cm and the 0-hour plant is 2 cm, so 8 − 2 = 6 cm. Do not add the numbers or read the wrong bar.","Difference = bigger − smaller (8 − 2 = 6).","جد العمودين ثم اطرح. نبات ٤ ساعات ارتفاعه ٨ سم ونبات ٠ ساعة ٢ سم، إذن ٨ − ٢ = ٦ سم. لا تجمع الأرقام ولا تقرأ عمودًا خطأ.","الفرق = الأكبر − الأصغر (٨ − ٢ = ٦)."],
59:["The skull is the bone that surrounds and protects the brain. In the picture it is the rounded bone at the top of the head.","Skull = brain's helmet.","الجمجمة هي العظمة التي تحيط بالدماغ وتحميه. في الصورة هي العظمة المستديرة في أعلى الرأس.","الجمجمة = خوذة الدماغ."],
60:["The ribs form a cage around the chest. They protect the heart and lungs. They are flexible so the chest can expand when we breathe.","Ribs = cage for heart and lungs.","تشكل الأضلاع قفصًا حول الصدر وتحمي القلب والرئتين. وهي مرنة فيتمدد الصدر عند التنفس.","الأضلاع = قفص القلب والرئتين."],
61:["The femur is the thigh bone, in the upper leg. It is the longest and strongest bone in the body. It supports our weight when we stand and walk.","Femur = thigh = longest bone.","عظمة الفخذ (الفخذ) في أعلى الساق، وهي أطول وأقوى عظمة في الجسم وتحمل وزننا عند الوقوف والمشي.","عظمة الفخذ = أطول عظمة."],
62:["In the peach model, the stone in the middle is the core, the juicy flesh is the mantle, and the thin skin is the crust. Layers of the Earth are in the same order: crust outside, core in the middle.","Skin = crust. Flesh = mantle. Stone = core.","في نموذج الخوخة تمثل النواة في الوسط اللب، واللحم العصيري الستار، والقشرة الرقيقة قشرة الأرض. ترتيب الطبقات متشابه: القشرة في الخارج واللب في الوسط.","القشرة = جلد الخوخة. الستار = اللحم. اللب = النواة."],
63:["A model is useful but never perfect. The peach stone is solid all the way through, but the Earth's outer core is liquid. Being round, having skin or being cut open are not limitations; they match or help show the Earth.","Models help us understand, but always have differences from the real thing.","النموذج مفيد لكنه ليس مطابقًا تمامًا. نواة الخوخة صلبة بالكامل بينما اللب الخارجي للأرض سائل. كون الخوخة كروية أو لها قشرة أو يمكن قطعها ليست حدودًا للنموذج.","النماذج تساعدنا على الفهم لكن فيها فروق عن الحقيقة."],
64:["Digging down from the surface you pass through the layers in order: crust, then mantle, then outer core, then inner core. The atmosphere is the air above the surface, not underground.","Crust → mantle → outer core → inner core.","عند الحفر من السطح نمر بالطبقات بالترتيب: القشرة ثم الستار ثم اللب الخارجي ثم اللب الداخلي. الغلاف الجوي هو الهواء فوق السطح وليس تحت الأرض.","قشرة ← ستار ← لب خارجي ← لب داخلي."],
65:["At midday the Sun is high in the sky, so shadows are short. In the late afternoon the Sun is low, so shadows are long. Picture B has the short shadow, so it is midday.","High Sun = short shadow. Low Sun = long shadow.","وقت الظهيرة تكون الشمس عالية في السماء فتكون الظلال قصيرة. وفي آخر النهار تكون الشمس منخفضة فتكون الظلال طويلة. الصورة B فيها الظل القصير فهي وقت الظهيرة.","شمس عالية = ظل قصير. شمس منخفضة = ظل طويل."],
66:["With fewer lamps, the same cells push the current through less resistance, so each lamp gets more energy and shines brighter. Removing a lamp does not dim the others in this circuit.","Fewer lamps = brighter lamps. More lamps = dimmer.","عند وجود مصابيح أقل تدفع الخلايا نفسها التيار عبر مقاومة أقل فيحصل كل مصباح على طاقة أكبر ويسطع أكثر. إزالة مصباح لا تخفّت الباقي في هذه الدائرة.","مصابيح أقل = سطوع أكبر. مصابيح أكثر = سطوع أقل."],
67:["A switch opens and closes the circuit. When it is closed, the loop is complete and electricity flows so the lamps light. When it is open there is a gap and the current stops. Wood does not conduct electricity, so only the contacts matter. It does not make electricity or store energy.","Closed switch = complete loop = lamps on. Open switch = gap = lamps off.","المفتاح يفتح الدائرة ويغلقها. عندما يكون مغلقًا تكتمل الحلقة ويمر التيار فتضيء المصابيح، وعندما يكون مفتوحًا يوجد فراغ فيتوقف التيار. المفتاح لا يصنع الكهرباء ولا يخزّن الطاقة.","مفتاح مغلق = دائرة كاملة = المصابيح تضيء. مفتاح مفتوح = فراغ = تنطفئ."],
68:["When the arm lifts, the muscle on top of the upper arm (the biceps) contracts. It gets shorter and fatter and pulls the lower arm bone up. Muscles pull but never push.","Lift = biceps contracts = shorter and pulls.","عندما ترتفع الذراع تنقبض العضلة فوق العضد (ذات الرأسين) فتصبح أقصر وأسمك وتشد عظمة الساعد إلى أعلى. العضلات تشدّ ولا تدفع.","رفع = ذات الرأسين تنقبض = تقصر وتشدّ."],
69:["Both circuits have the same two cells, so the same amount of energy. In Circuit 2 that energy is shared between only two lamps, so each lamp gets more and is brighter. In Circuit 1 it is shared among three lamps, so each is dimmer.","Same energy ÷ fewer lamps = brighter lamps.","للدائرتين الخليتان نفسهما أي الطاقة نفسها. في الدائرة ٢ تتوزع الطاقة على مصباحين فقط فيحصل كل مصباح على أكثر ويسطع أكثر. في الدائرة ١ تتوزع على ثلاثة مصابيح فيكون كل مصباح أخفت.","الطاقة نفسها ÷ مصابيح أقل = سطوع أكبر."]
};

Object.assign(EX,{70:["During exercise the muscles use more oxygen and food. Blood carries them, so the heart beats faster to pump more blood to the muscles. A fast heartbeat during exercise is normal, not tiredness.", "Exercise → muscles need more oxygen → heart pumps faster.", "أثناء الجري تستهلك العضلات أكسجينًا وغذاءً أكثر. والدم هو الذي ينقلهما، لذلك ينبض القلب أسرع ليضخ دمًا أكثر إلى العضلات. النبض السريع أثناء الرياضة أمر طبيعي وليس تعبًا.", "رياضة ← العضلات تحتاج أكسجينًا أكثر ← القلب ينبض أسرع."],
71:["Living things grow and repair themselves. Bones grow longer as a child grows and a broken bone heals, so bones are living parts of the body. Colour, position and weight do not tell us if something is alive.", "Alive = grows + repairs itself.", "الكائنات الحية تنمو وتصلح نفسها. العظام تطول مع نمو الطفل والعظم المكسور يلتئم، لذلك فالعظام أجزاء حية من الجسم. اللون والمكان والوزن لا تدل على أن الشيء حي.", "حي = ينمو + يصلح نفسه."],
72:["Compare the numbers: 70 at rest and 110 after jumping. The pulse went up after exercise, so exercise makes the heart beat faster. A good conclusion matches the data.", "Compare the numbers, then say what changed and why.", "قارن الأرقام: ٧٠ في الراحة و١١٠ بعد القفز. ارتفع النبض بعد الرياضة، إذن الرياضة تجعل القلب ينبض أسرع. الاستنتاج الجيد يتفق مع البيانات.", "قارن الأرقام ثم قل ما الذي تغيّر ولماذا."],
73:["Bones cannot move on their own. Muscles are attached to bones and pull them to make the body move. If the muscle is injured, the leg cannot move the bone properly even though the bone is healthy.", "Bones are the frame. Muscles are the movers.", "العظام لا تتحرك وحدها. العضلات مرتبطة بالعظام وتشدّها لتحرّك الجسم. وإذا أصيبت العضلة لا تستطيع تحريك العظم جيدًا رغم أنه سليم.", "العظام هيكل. العضلات محرّك."],
74:["Plants need light to make the green chlorophyll and to make food. Without light the leaves lose their green colour and turn pale and yellow, and the plant becomes weak.", "No light → no food → pale, weak plant.", "يحتاج النبات إلى الضوء ليصنع الكلوروفيل الأخضر وليصنع غذاءه. وبدون ضوء تفقد الأوراق لونها الأخضر وتصبح شاحبة صفراء ويضعف النبات.", "لا ضوء ← لا غذاء ← نبات شاحب وضعيف."],
75:["Plants need several things: light and carbon dioxide from the air to make food, water, and nutrients from the soil. Missing any one of them slows growth.", "Plants need: water + light + air + nutrients.", "يحتاج النبات إلى عدة أشياء: الضوء وثاني أكسيد الكربون من الهواء لصنع الغذاء، والماء، والمغذيات من التربة. نقص أي منها يبطئ النمو.", "النبات يحتاج: ماء + ضوء + هواء + مغذيات."],
76:["Both plants had water, so the only difference was light. Since only A had light and stayed healthy, we can conclude that light is needed. This works only when everything else is the same.", "The one thing that is different explains the result.", "كان لدى النباتين ماء، فالفرق الوحيد هو الضوء. وبما أن A فقط حصل على الضوء وبقي سليمًا نستنتج أن الضوء ضروري. وهذا صحيح عندما يتطابق كل ما عدا ذلك.", "الشيء الوحيد المختلف هو سبب النتيجة."],
77:["A seed needs water, air and a suitable temperature to germinate. Dry sand gives no water, so the seed cannot sprout. A seed has no leaves yet and does not need light to germinate.", "Seeds germinate with water, air and warmth.", "تحتاج البذرة إلى الماء والهواء ودرجة حرارة مناسبة لتنبت. الرمل الجاف لا يعطي ماءً فلا تتبرعم البذرة. وليس للبذرة أوراق بعد ولا تحتاج إلى الضوء لتنبت.", "تنبت البذور بالماء والهواء والدفء."],
78:["Flowers must be pollinated before they can make fruit with seeds. Bees move pollen from flower to flower. With fewer bees, fewer flowers are pollinated, so fewer fruits form.", "No pollination → no fruit.", "يجب أن تُلقَّح الأزهار قبل أن تكوّن ثمرة فيها بذور. والنحل ينقل حبوب اللقاح من زهرة إلى أخرى. فمع قلة النحل تقل الأزهار الملقحة فتقل الثمار.", "لا تلقيح ← لا ثمار."],
79:["Genes carry the instructions for traits like eye colour and are passed from parents to offspring. Scars, learned habits and food are not genes, so they are not inherited.", "Genes = instructions passed from parents.", "تحمل الجينات تعليمات الصفات مثل لون العينين وتنتقل من الآباء إلى الأبناء. أما الندوب والعادات المتعلمة والغذاء فليست جينات لذلك لا تورَّث.", "الجينات = تعليمات تنتقل من الوالدين."],
80:["An adaptation is a feature that helps a living thing survive in its habitat. A camel's wide feet spread its weight so it does not sink in soft sand. Thick fur, webbed feet and wings suit other habitats.", "Adaptation = a feature that fits the habitat.", "التكيّف صفة تساعد الكائن الحي على البقاء في بيئته. أقدام الجمل العريضة توزّع وزنه فلا يغوص في الرمل الناعم. أما الفرو السميك والأقدام الغشائية والأجنحة فتناسب بيئات أخرى.", "التكيّف = صفة تناسب البيئة."],
81:["Thick fur and fat trap body heat and stop the bear losing heat to the freezing air and water. This structure (thick fur and fat) has a function (staying warm).", "Structure → function: fur and fat keep it warm.", "الفرو السميك والدهون يحبسان حرارة الجسم ويمنعان فقدانها في الهواء والماء المتجمد. فالتركيب (فرو ودهون) له وظيفة (البقاء دافئًا).", "التركيب ← الوظيفة: فرو ودهون = دفء."],
82:["A long, thin beak can reach deep inside flowers to get nectar. Hard seeds need a short strong beak, and large fish need a big beak to catch and hold them.", "Beak shape matches the food it eats.", "المنقار الطويل الرفيع يصل إلى عمق الأزهار ليأخذ الرحيق. أما البذور الصلبة فتحتاج منقارًا قصيرًا قويًا، والأسماك الكبيرة تحتاج منقارًا كبيرًا للإمساك بها.", "شكل المنقار يناسب الغذاء."],
83:["Deserts have very little water. A cactus stores water in its thick stem, and spines lose much less water than wide leaves do. These features help it survive in a dry habitat.", "Desert plant: store water, lose less water.", "الصحراء قليلة الماء. يخزن الصبار الماء في ساقه السميكة، والأشواك تفقد ماءً أقل بكثير من الأوراق العريضة. وهذه الصفات تساعده على البقاء في بيئة جافة.", "نبات صحراوي: يخزن الماء ويفقد أقل."],
84:["White rabbits are hidden in the snow, so foxes catch fewer of them. More white rabbits survive and have babies with the same inherited colour. Over many years the white rabbits become more common.", "Better adapted → survive more → pass the trait on.", "الأرانب البيضاء تختفي في الثلج فتصطاد الثعالب منها عددًا أقل. وينجو منها عدد أكبر ويلدون صغارًا يرثون اللون نفسه. فمع السنين يصبح عدد الأرانب البيضاء أكبر.", "الأكثر تكيّفًا ينجو أكثر ويورّث صفته."],
85:["Losing a finger happens during life, so it is an acquired change. It does not change the genes that the parent passes on, so the baby is born with all its fingers.", "Acquired changes are NOT passed on.", "فقدان الإصبع يحدث أثناء الحياة فهو تغيّر مكتسب، ولا يغيّر الجينات التي ينقلها الوالد، لذلك يولد الطفل بكل أصابعه.", "التغيرات المكتسبة لا تنتقل."],
86:["A herbivore eats only plants (like a cow or rabbit). A carnivore eats only animals, and an omnivore eats both plants and animals.", "Herb = plants. Carni = meat. Omni = everything.", "آكل الأعشاب يأكل النباتات فقط (مثل البقرة والأرنب). وآكل اللحوم يأكل الحيوانات فقط، وآكل كل شيء يأكل النباتات والحيوانات معًا.", "أعشاب = نباتات. لحوم = حيوانات. كل شيء = الاثنان."],
87:["Plants use sunlight to make food. Animals get energy by eating plants or by eating animals that ate plants. So the energy in most food chains starts with the Sun.", "Sun → plant → herbivore → carnivore.", "تستخدم النباتات ضوء الشمس لصنع الغذاء. وتحصل الحيوانات على الطاقة بأكل النباتات أو بأكل حيوانات أكلت النباتات. لذلك تبدأ الطاقة في معظم السلاسل الغذائية من الشمس.", "شمس ← نبات ← آكل أعشاب ← آكل لحوم."],
88:["A solid keeps its own shape because its particles are held tightly. A liquid takes the shape of its container and a gas spreads out to fill it.", "Solid = own shape. Liquid = container shape. Gas = fills everything.", "المادة الصلبة تحتفظ بشكلها لأن جزيئاتها متماسكة بإحكام. السائل يأخذ شكل إنائه والغاز ينتشر ليملأ المكان.", "صلب = شكله ثابت. سائل = شكل الإناء. غاز = يملأ المكان."],
89:["Heat from the Sun changes liquid water into water vapour, a gas in the air. This is evaporation. The water is not destroyed, it is just in a different state.", "Matter changes state. It does not vanish.", "حرارة الشمس تحوّل الماء السائل إلى بخار ماء، وهو غاز في الهواء، وهذا هو التبخر. الماء لم يُدمَّر بل تغيّرت حالته.", "المادة تغيّر حالتها ولا تختفي."],
90:["The sugar breaks into particles too small to see and mixes evenly with the water. This mixture is a solution. The sugar is still there, and you can taste it.", "Dissolved ≠ gone. It is still in the water.", "يتفتت السكر إلى جزيئات صغيرة جدًا لا ترى وتختلط بالماء بانتظام. هذا الخليط محلول. السكر ما زال موجودًا ويمكنك تذوقه.", "الذائب ليس مختفيًا. هو ما زال في الماء."],
91:["A sieve has holes. Small sand grains fall through and large gravel pieces stay on top. A magnet only picks up magnetic things such as iron.", "Sieve separates by size.", "للمنخل ثقوب. تمر حبات الرمل الصغيرة وتبقى قطع الحصى الكبيرة فوقه. أما المغناطيس فيلتقط المواد المغناطيسية مثل الحديد فقط.", "المنخل يفصل حسب الحجم."],
92:["Filter paper has tiny holes. Liquid passes through and solid pieces that have not dissolved stay on the paper. Dissolved substances pass through with the liquid.", "Filter = solid stays, liquid passes.", "لورق الترشيح ثقوب صغيرة جدًا. يمر السائل وتبقى القطع الصلبة غير الذائبة على الورق. أما المواد الذائبة فتمر مع السائل.", "الترشيح: الصلب يبقى والسائل يمر."],
93:["Water particles are small enough to pass through the holes, but the mud pieces are bigger, so they are trapped on the paper. Filtering separates things by size and by whether they dissolve.", "Big pieces get trapped, small ones pass.", "جزيئات الماء صغيرة فتمر عبر الثقوب، أما قطع الطين فأكبر فتحتجز على الورق. الترشيح يفصل حسب الحجم وحسب الذوبان.", "الكبير يحتجز والصغير يمر."],
94:["The salt dissolved in the water and passed through the filter with it. Heating the salty water makes the water evaporate and leaves the salt crystals behind. Salt is not magnetic.", "Dissolved solid? Evaporate the liquid.", "ذاب الملح في الماء ومرّ معه عبر المرشح. بتسخين الماء المالح يتبخر الماء وتبقى بلورات الملح. والملح ليس مغناطيسيًا.", "مادة صلبة مذابة؟ بخّر السائل."],
95:["When sugar dissolves, it splits into particles far too small for any sieve or filter to catch. They mix with the liquid and pass straight through. We need evaporation to get the sugar back.", "Sieves and filters cannot catch dissolved particles.", "عندما يذوب السكر يتفتت إلى جزيئات أصغر بكثير من أن يحجزها أي منخل أو مرشح. فتختلط بالسائل وتمر مباشرة. نحتاج التبخير لاستعادة السكر.", "المناخل والمرشحات لا تحجز الجزيئات الذائبة."],
96:["Gravity is the force that pulls everything towards the centre of the Earth. It is why a dropped ball falls down.", "Gravity pulls DOWN.", "الجاذبية هي القوة التي تشدّ كل شيء نحو مركز الأرض، ولهذا تسقط الكرة عند إفلاتها.", "الجاذبية تشدّ إلى الأسفل."],
97:["Friction is a force between two surfaces rubbing together. It acts against the motion and slows the box until it stops.", "Friction = rubbing force that slows things.", "الاحتكاك قوة بين سطحين يحتكان ببعضهما. يعمل عكس الحركة ويبطئ الصندوق حتى يتوقف.", "الاحتكاك = قوة الاحتكاك تبطئ الأجسام."],
98:["Rough surfaces have more friction, so they grip better. Smooth, oily or icy surfaces have little friction, so things slide easily.", "Rougher = more friction = more grip.", "الأسطح الخشنة احتكاكها أكبر فتثبّت أكثر. أما الأسطح الملساء أو الزيتية أو الجليدية فاحتكاكها قليل فتنزلق الأشياء بسهولة.", "أخشن = احتكاك أكبر = ثبات أكثر."],
99:["On the long ramp the box is lifted gradually, so each push is smaller, but she pushes it along a longer distance. The ramp makes the job easier but does not remove the effort.", "Less force, more distance.", "على المنحدر الطويل يرتفع الصندوق تدريجيًا فتكون كل دفعة أصغر لكنها تدفعه مسافة أطول. المنحدر يسهّل العمل لكنه لا يلغي الجهد.", "قوة أقل ومسافة أكبر."],
100:["A lever's turning effect depends on the weight AND the distance from the pivot. A light child far from the middle can balance a heavy child close to the middle.", "Turning effect = weight × distance from the pivot.", "يعتمد أثر الدوران في الرافعة على الوزن وعلى البعد عن نقطة الارتكاز معًا. يستطيع طفل خفيف بعيد عن المنتصف أن يوازن طفلًا ثقيلًا قريبًا منه.", "أثر الدوران = الوزن × البعد عن نقطة الارتكاز."],
101:["In a fair test only one thing changes (the number of cells). The bulb and wires must stay the same, so any change in brightness is caused by the cells.", "Change ONE thing, keep the rest.", "في الاختبار العادل يتغير شيء واحد فقط (عدد الخلايا). ويجب أن يبقى المصباح والأسلاك كما هي، فيكون أي تغيّر في السطوع بسبب الخلايا.", "غيّر شيئًا واحدًا وثبّت الباقي."],
102:["Earthquake waves change speed and direction when they pass through different layers. By measuring them far away, scientists work out which layers are solid or liquid. This is indirect evidence.", "Evidence can be indirect, like waves as clues.", "تتغير سرعة موجات الزلازل واتجاهها عندما تمر في طبقات مختلفة. وبقياسها بعيدًا يعرف العلماء أي الطبقات صلبة أو سائلة. وهذا دليل غير مباشر.", "الدليل قد يكون غير مباشر كالموجات."],
103:["Ferns need warmth and water to live. If a fern fossil is found in a cold place, then long ago that place must have been warm. Fossils are clues to past climates.", "Fossil + needs of the living thing = past climate.", "يحتاج السرخس إلى الدفء والماء ليعيش. فإذا وُجدت حفرية سرخس في مكان بارد فالمكان كان دافئًا منذ زمن بعيد. الحفريات أدلة على مناخات الماضي.", "حفرية + حاجات الكائن = مناخ الماضي."],
104:["A thermometer measures how hot or cold something is. A rain gauge measures rainfall and a wind vane shows wind direction.", "Thermometer = temperature. Rain gauge = rain. Wind vane = wind direction.", "الترمومتر يقيس مقدار الحرارة أو البرودة. ومقياس المطر يقيس كمية الأمطار ودوّارة الرياح تبيّن اتجاه الرياح.", "ترمومتر = حرارة. مقياس المطر = مطر. دوّارة = اتجاه الرياح."],
105:["Precipitation is water falling from clouds. Evaporation is liquid turning to gas, and condensation is gas turning to liquid, which forms the clouds.", "Water cycle: evaporate → condense → precipitate.", "الهطول هو سقوط الماء من الغيوم. أما التبخر فهو تحول السائل إلى غاز والتكاثف تحول الغاز إلى سائل وبه تتكون الغيوم.", "دورة الماء: تبخر ← تكاثف ← هطول."],
106:["There is water vapour (a gas) in the air. When it touches the cold glass it cools and changes into liquid drops. This is condensation, the same process that forms clouds.", "Cold surface + water vapour = condensation.", "يوجد بخار ماء (غاز) في الهواء. وعندما يلامس الكأس البارد يبرد ويتحول إلى قطرات سائلة. هذا هو التكاثف وهو العملية نفسها التي تكوّن الغيوم.", "سطح بارد + بخار ماء = تكاثف."],
107:["Heat gives water particles energy to escape as vapour, and wind carries the vapour away so more water can evaporate. Hot and windy weather therefore speeds up evaporation.", "More heat + more wind = faster evaporation.", "الحرارة تعطي جزيئات الماء طاقة لتتحرر على شكل بخار، والرياح تحمل البخار بعيدًا فيتبخر ماء أكثر. لذلك يسرّع الطقس الحار العاصف التبخر.", "حرارة أكثر + رياح أكثر = تبخر أسرع."],
108:["Climate is the pattern of weather over many years. Rain on 300 days a year for 30 years shows a very wet climate, much wetter than a city with 20 rainy days.", "Many years of data = climate.", "المناخ هو نمط الطقس عبر سنوات كثيرة. المطر ٣٠٠ يوم في السنة طوال ٣٠ سنة يدل على مناخ شديد الرطوبة، أكثر بكثير من مدينة فيها ٢٠ يومًا ممطرًا.", "بيانات سنوات كثيرة = مناخ."],
109:["In the morning the Sun rises and its light heats the ground more and more, so the air warms up. In the afternoon and evening the Sun is lower and the ground loses heat, so it cools down.", "Sun high = warmer. Sun low or gone = cooler.", "في الصباح ترتفع الشمس ويسخّن ضوؤها الأرض أكثر فأكثر فيدفأ الهواء. وبعد الظهر وفي المساء تنخفض الشمس وتفقد الأرض حرارتها فتبرد.", "شمس عالية = أدفأ. شمس منخفضة أو غائبة = أبرد."],
110:["To see if something is increasing we need data over a long time so we can compare. One day or one week only shows the weather, not the trend in the climate.", "Trends need data over a long time.", "لنعرف هل شيء ما يزداد نحتاج إلى بيانات عن زمن طويل لنقارن. يوم أو أسبوع واحد يبيّن الطقس فقط وليس اتجاه المناخ.", "الاتجاهات تحتاج بيانات طويلة المدى."],
111:["The Sun is a star: a huge ball of hot gas that makes its own light and heat. Planets, like Earth, do not make their own light.", "Sun = star. Earth = planet.", "الشمس نجم، وهي كرة ضخمة من الغازات الساخنة تصنع ضوءها وحرارتها بنفسها. أما الكواكب مثل الأرض فلا تصنع ضوءها.", "الشمس = نجم. الأرض = كوكب."],
112:["As the Moon orbits Earth, we see different amounts of its sunlit half. These changing shapes are called the phases of the Moon. They repeat about every month.", "Moon orbit → phases (about 1 month).", "مع دوران القمر حول الأرض نرى أجزاء مختلفة من نصفه المضاء بالشمس. وتسمى هذه الأشكال المتغيرة أطوار القمر وتتكرر تقريبًا كل شهر.", "دوران القمر ← أطوار (نحو شهر)."],
113:["The planets in order from the Sun are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Mars comes right after Earth and just before Jupiter.", "My Very Educated Mother Just Served Us Noodles.", "ترتيب الكواكب من الشمس: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون. المريخ يأتي بعد الأرض مباشرة وقبل المشتري.", "عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون."],
114:["Distance is not the only thing that matters. Venus is wrapped in a thick atmosphere that traps heat, so it is the hottest planet. Mercury has almost no atmosphere to hold heat.", "Atmosphere can trap heat, so distance is not the only factor.", "المسافة ليست العامل الوحيد. الزهرة محاطة بغلاف جوي سميك يحبس الحرارة لذلك هي أسخن الكواكب. أما عطارد فلا يملك غلافًا جويًا تقريبًا ليحتفظ بالحرارة.", "الغلاف الجوي قد يحبس الحرارة فالمسافة ليست العامل الوحيد."],
115:["A natural resource comes from nature, like water, air, soil, wood, wind and minerals. A toy, a bottle and a bicycle are made by people from materials.", "Natural resource = from nature, not made by people.", "المورد الطبيعي يأتي من الطبيعة مثل الماء والهواء والتربة والخشب والرياح والمعادن. أما اللعبة والزجاجة والدراجة فيصنعها الناس من مواد.", "مورد طبيعي = من الطبيعة وليس من صنع الإنسان."],
116:["Recycling means collecting used materials such as paper, glass and metal and making them into new products. It saves resources and reduces rubbish.", "Reduce, Reuse, Recycle.", "إعادة التدوير هي جمع المواد المستعملة مثل الورق والزجاج والمعادن وصنع منتجات جديدة منها. فهي توفر الموارد وتقلل النفايات.", "قلّل، أعد الاستعمال، دوّر."],
117:["Electricity is made using resources such as fuels. Using less electricity saves those resources, so we should switch things off when we do not need them.", "Use less = save resources.", "تُنتج الكهرباء باستخدام موارد مثل الوقود. استعمال كهرباء أقل يوفر هذه الموارد، لذلك نطفئ الأجهزة عندما لا نحتاجها.", "استعمل أقل = وفّر الموارد."],
118:["Metals such as aluminium can be melted and made into new cans. Used tissues, oily food scraps and dirty nappies are not suitable for recycling.", "Metal, glass, paper and some plastics can be recycled.", "يمكن صهر الفلزات مثل الألمنيوم وصنع علب جديدة منها. أما المناديل المستعملة وبقايا الطعام الزيتية والحفاضات المتسخة فلا تصلح للتدوير.", "فلزات وزجاج وورق وبعض البلاستيك يمكن تدويرها."],
119:["Solar and wind energy never run out and make almost no air pollution. Oil is also a fossil fuel, so it also runs out and pollutes. The best plan fixes both problems.", "Best plan = renewable energy (fixes pollution AND running out).", "طاقة الشمس والرياح لا تنفد ولا تلوّث الهواء تقريبًا. أما النفط فهو وقود أحفوري أيضًا فينفد ويلوّث. أفضل خطة تحل المشكلتين معًا.", "أفضل خطة = طاقة متجددة (تحل التلوث والنفاد)."],
120:["A resource is non-renewable when we use it much faster than nature can make it. Oil needs millions of years to form, so once it is used up it cannot be replaced in our lifetime.", "Non-renewable = used faster than it forms.", "المورد غير متجدد عندما نستهلكه أسرع بكثير مما تصنعه الطبيعة. يحتاج النفط ملايين السنين ليتكوّن، فإذا نفد لا يمكن تعويضه في حياتنا.", "غير متجدد = يُستهلك أسرع مما يتكوّن."]});

x("11","K",400,'mcq',"How many bones are there in the human skeleton?|كم عدد العظام في الهيكل العظمي للإنسان؟","Guesses the number of bones|يخمّن عدد العظام",{o:sp("206;106;306;26|٢٠٦;١٠٦;٣٠٦;٢٦"),ex:["Our skeleton is made of 206 bones. They come in different sizes and shapes and are joined together to form a strong frame that supports the body from the inside.", "Human skeleton = 206 bones.", "يتكوّن هيكلنا العظمي من ٢٠٦ عظمة. وهي بأحجام وأشكال مختلفة وترتبط معًا لتكوّن إطارًا قويًا يسند الجسم من الداخل.", "الهيكل العظمي للإنسان = ٢٠٦ عظمة."]});
x("11","A",475,'mcq',"Tia makes a model skeleton from straws and modelling clay. How is her model different from a real skeleton?|صنعت تيا نموذجًا لهيكل عظمي من القش والصلصال. كيف يختلف نموذجها عن الهيكل الحقيقي؟","Thinks a model must be exactly like the real thing|يظن أن النموذج يجب أن يطابق الحقيقة تمامًا",{o:sp("The straws and clay are not hard and strong like real bones;It has more bones than a real skeleton;It is alive;It is made of bones|القش والصلصال ليسا صلبين وقويين مثل العظام الحقيقية;فيه عظام أكثر من الهيكل الحقيقي;إنه حي;مصنوع من العظام"),ex:["A model helps us see what something looks like, but it is never an exact copy. Real bones are hard and strong, while straws and clay are not.", "A model is NOT a true copy of the real thing.", "يساعدنا النموذج على رؤية شكل الشيء لكنه ليس نسخة مطابقة. العظام الحقيقية صلبة وقوية أما القش والصلصال فليسا كذلك.", "النموذج ليس نسخة طبق الأصل من الحقيقة."]});
x("11","R",550,'mcq',"Two pairs make model skeletons. One pair's model has a jaw, a spine and a rib cage. The other pair's model has only arms and legs. Which is the better model of a human skeleton, and why?|صنعت مجموعتان نموذجين للهيكل العظمي. نموذج الأولى فيه فك وعمود فقري وقفص صدري، ونموذج الثانية فيه ذراعان وساقان فقط. أيهما أفضل ولماذا؟","Cannot judge how good a model is|لا يحكم على جودة النموذج",{o:sp("The first, because it shows more of the main bones of the real skeleton;The second, because arms and legs are the only bones;The first, because it is bigger;Neither, because models are never useful|الأولى لأنها تُظهر عددًا أكبر من العظام الرئيسة في الهيكل الحقيقي;الثانية لأن الذراعين والساقين هما العظام الوحيدة;الأولى لأنها أكبر;لا شيء لأن النماذج غير مفيدة"),ex:["A good model includes the important parts of the real thing: skull, jaw, spine, rib cage, arm and leg bones. We can improve a model by adding more of these parts.", "Better model = more of the real parts shown.", "النموذج الجيد يضم الأجزاء المهمة في الشيء الحقيقي: الجمجمة والفك والعمود الفقري والقفص الصدري وعظام الذراعين والساقين. ويمكن تحسين النموذج بإضافة المزيد من هذه الأجزاء.", "نموذج أفضل = أجزاء حقيقية أكثر."]});
x("12","A",475,'mcq',"Hana's baby brother and her father stand next to each other. Why is her father's skeleton much bigger?|يقف أخو هناء الرضيع بجانب والدها. لماذا هيكل والدها أكبر بكثير؟","Thinks the skeleton does not grow|يظن أن الهيكل العظمي لا ينمو",{o:sp("Our skeleton grows as we grow until we are adults;Fathers have more bones;Babies have no skeleton;Bones shrink with age|يكبر هيكلنا العظمي كلما كبرنا حتى نصبح بالغين;الآباء لديهم عظام أكثر;الرضع بلا هيكل عظمي;العظام تصغر مع العمر"),ex:["We grow bigger because our skeleton grows. An adult's skeleton has stopped growing and is much bigger than a child's skeleton.", "We grow because our skeleton grows.", "نكبر لأن هيكلنا العظمي ينمو. وهيكل البالغ توقف عن النمو وهو أكبر بكثير من هيكل الطفل.", "نكبر لأن هيكلنا العظمي ينمو."]});
x("12","R",550,'mcq',"Marcus and Arun measured bone length by counting hand lengths. Why is this NOT a good way to compare their results?|قاس ماركوس وأرون طول العظام بعدّ أطوال أيديهما. لماذا ليست هذه طريقة جيدة لمقارنة نتائجهما؟","Does not see why standard units are needed|لا يرى سبب الحاجة إلى وحدات قياسية",{o:sp("Hands are different sizes, so we should use standard units such as centimetres;Hands are too small to measure bones;Bones cannot be measured;Hand lengths are always the same|الأيدي مختلفة الحجم لذا يجب استخدام وحدات قياسية مثل السنتيمتر;الأيدي صغيرة جدًا;لا يمكن قياس العظام;أطوال الأيدي متساوية دائمًا"),ex:["Everyone's hands are a different size, so results in hand lengths cannot be compared. A standard unit such as a centimetre is the same for everybody, so we can compare results.", "Measure in standard units (cm) so results can be compared.", "أيدي الناس مختلفة الحجم فلا يمكن مقارنة النتائج بأطوال الأيدي. أما الوحدة القياسية مثل السنتيمتر فهي نفسها للجميع فنستطيع مقارنة النتائج.", "قِس بوحدات قياسية (سم) لتتمكن من المقارنة."]});
x("12","K",475,'mcq',"Which is NOT one of the main functions of the skeleton?|أي مما يلي ليس من الوظائف الرئيسة للهيكل العظمي؟","Does not know the functions of the skeleton|لا يعرف وظائف الهيكل العظمي",{o:sp("Making food for the body;Protecting organs;Giving the body shape;Allowing us to move|صنع الغذاء للجسم;حماية الأعضاء;إعطاء الجسم شكله;مساعدتنا على الحركة"),ex:["The skeleton protects organs, gives the body shape and supports it, and allows movement (with muscles). It does not make food for the body.", "Skeleton: protect, shape, support, move.", "الهيكل العظمي يحمي الأعضاء ويعطي الجسم شكله ويسنده ويساعد على الحركة (مع العضلات). لكنه لا يصنع الغذاء للجسم.", "الهيكل: يحمي، يشكّل، يسند، يحرّك."]});
x("13","K",400,'mcq',"What do muscles do to the bones they are joined to?|ماذا تفعل العضلات بالعظام المرتبطة بها؟","Thinks muscles can push bones|يظن أن العضلات تدفع العظام",{o:sp("They pull on them;They push them;They break them;They grow into them|تشدّها;تدفعها;تكسرها;تنمو داخلها"),ex:["Muscles move bones by pulling on them. They pull by getting shorter, which is called contracting.", "Muscles PULL by contracting.", "تحرّك العضلات العظام بالشدّ عليها. وهي تشدّ عندما تقصر، ويسمى ذلك الانقباض.", "العضلات تشدّ عند الانقباض."]});
x("13","R",550,'mcq',"When your arm bends, muscle A gets shorter and fatter. What is muscle B doing, and why?|عندما تنثني ذراعك تقصر العضلة A وتصبح أسمك. ماذا تفعل العضلة B ولماذا؟","Does not know that muscles work in pairs|لا يعرف أن العضلات تعمل في أزواج",{o:sp("Relaxing, because muscles work in pairs and when one contracts the other relaxes;Contracting too, to help it;Disappearing;Pushing the bone down|ترتخي لأن العضلات تعمل في أزواج وعندما تنقبض إحداهما ترتخي الأخرى;تنقبض أيضًا لتساعدها;تختفي;تدفع العظم إلى الأسفل"),ex:["Muscles always work in pairs. One muscle contracts and pulls on the bone while the other relaxes and gets longer, which lets the bone move.", "Pair: one contracts, the other relaxes.", "تعمل العضلات دائمًا في أزواج. تنقبض إحداها وتشدّ العظم بينما ترتخي الأخرى وتطول، فيتحرك العظم.", "زوج العضلات: واحدة تنقبض والأخرى ترتخي."]});
x("13","R",625,'mcq',"Arun sits for eight hours a day and plays for only one hour. Which advice is best and why?|يجلس أرون ثماني ساعات يوميًا ويلعب ساعة واحدة فقط. ما أفضل نصيحة ولماذا؟","Thinks sitting still is good for the body|يظن أن الجلوس الطويل مفيد للجسم",{o:sp("Move more, because movement makes the heart, lungs, muscles and bones stronger;Sit more, to rest his bones;Move less, to save energy;Nothing, sitting is as good as moving|يتحرك أكثر لأن الحركة تقوّي القلب والرئتين والعضلات والعظام;يجلس أكثر ليريح عظامه;يتحرك أقل ليوفر الطاقة;لا شيء فالجلوس مثل الحركة"),ex:["Sitting still for a long time is not good for our bodies. Movement makes the heart and lungs work better, makes muscles and bones stronger and helps us think better.", "Movement keeps us healthy.", "الجلوس الطويل ليس جيدًا لأجسامنا. فالحركة تجعل القلب والرئتين يعملان بشكل أفضل وتقوّي العضلات والعظام وتساعدنا على التفكير.", "الحركة تحافظ على صحتنا."]});
x("14","K",400,'mcq',"What do we call animals that have a backbone?|ماذا نسمّي الحيوانات التي لها عمود فقري؟","Mixes up vertebrates and invertebrates|يخلط بين الفقاريات واللافقاريات",{o:sp("Vertebrates;Invertebrates;Exoskeletons;Producers|فقاريات;لافقاريات;هياكل خارجية;منتجات"),ex:["Vertebrates are animals with a backbone, and the skeleton is inside the body. Invertebrates are animals without a backbone.", "Vertebrate = with a backbone.", "الفقاريات حيوانات لها عمود فقري وهيكلها العظمي داخل الجسم. أما اللافقاريات فبلا عمود فقري.", "فقاري = له عمود فقري."]});
x("14","K",475,'mcq',"Which animal is an invertebrate with an exoskeleton?|أي حيوان لافقاري له هيكل خارجي؟","Thinks all animals have bones|يظن أن كل الحيوانات لها عظام",{o:sp("Beetle;Eagle;Frog;Goat|الخنفساء;النسر;الضفدع;الماعز"),ex:["A beetle is an insect. It has no backbone and has a hard outer layer called an exoskeleton. An eagle, a frog and a goat all have a backbone.", "Insects, crabs and spiders have an exoskeleton.", "الخنفساء حشرة بلا عمود فقري ولها طبقة خارجية صلبة تسمى الهيكل الخارجي. أما النسر والضفدع والماعز فلها عمود فقري.", "الحشرات والسرطانات والعناكب لها هيكل خارجي."]});
x("14","A",475,'mcq',"A vertebrate has dry, scaly skin and lives mostly on land. Which group does it belong to?|فقاري جلده جاف ومتقشر ويعيش في الغالب على اليابسة. إلى أي مجموعة ينتمي؟","Confuses reptiles with amphibians|يخلط بين الزواحف والبرمائيات",{o:sp("Reptile;Amphibian;Bird;Fish|زواحف;برمائيات;طيور;أسماك"),ex:["Reptiles, such as snakes and lizards, have dry scales. Amphibians, such as frogs, have smooth wet skin. Birds have feathers and fish live in water.", "Dry scales = reptile. Smooth wet skin = amphibian.", "الزواحف مثل الثعابين والسحالي لها حراشف جافة. والبرمائيات مثل الضفادع جلدها أملس رطب. والطيور لها ريش والأسماك تعيش في الماء.", "حراشف جافة = زواحف. جلد أملس رطب = برمائيات."]});
x("14","A",475,'mcq',"Use the key: the animal has a bony skeleton, it has legs and it has wings. What is it?|استخدم المفتاح: للحيوان هيكل عظمي ولديه أرجل ولديه أجنحة. ما هو؟","Cannot follow an identification key|لا يتبع مفتاح التصنيف",{o:sp("Eagle;Cat;Fish;Crab|نسر;قطة;سمكة;سرطان"),ex:["An identification key asks yes/no questions. Bony skeleton: yes. Legs: yes. Wings: yes. That leads to the eagle. A cat has no wings, a fish has fins and a crab has an exoskeleton.", "Follow the key one question at a time.", "مفتاح التصنيف يسأل أسئلة بنعم أو لا. هيكل عظمي: نعم. أرجل: نعم. أجنحة: نعم. فالنتيجة النسر. القطة بلا أجنحة والسمكة لها زعانف والسرطان له هيكل خارجي.", "اتبع المفتاح سؤالًا بعد آخر."]});
x("14","R",550,'mcq',"A student puts crab, beetle and spider in one group, and goat, eagle and frog in another group. What rule did he use?|وضع طالب السرطان والخنفساء والعنكبوت في مجموعة، والماعز والنسر والضفدع في أخرى. ما القاعدة التي استخدمها؟","Groups animals by looks instead of skeleton type|يصنف الحيوانات بالشكل لا بنوع الهيكل",{o:sp("Animals with an exoskeleton and no backbone, and animals with a bony skeleton and a backbone;Animals that can fly and animals that cannot;Big animals and small animals;Animals that live in water and on land|حيوانات بهيكل خارجي وبلا عمود فقري، وحيوانات بهيكل عظمي وعمود فقري;حيوانات تطير وأخرى لا تطير;حيوانات كبيرة وصغيرة;حيوانات تعيش في الماء وعلى اليابسة"),ex:["Crab, beetle and spider are invertebrates with an exoskeleton. Goat, eagle and frog are vertebrates with a bony skeleton inside. Classifying means grouping by shared features.", "Classify by shared features (skeleton type).", "السرطان والخنفساء والعنكبوت لافقاريات لها هيكل خارجي. والماعز والنسر والضفدع فقاريات لها هيكل عظمي داخلي. التصنيف هو التجميع حسب الصفات المشتركة.", "صنّف حسب الصفات المشتركة (نوع الهيكل)."]});
x("15","K",400,'mcq',"What is a vaccination?|ما اللقاح (التطعيم)؟","Thinks vaccinations are only for sick people|يظن أن اللقاح للمرضى فقط",{o:sp("An injection that can prevent a disease;A cream for itching;A type of germ;A kind of food|حقنة يمكنها منع مرض;كريم للحكة;نوع من الجراثيم;نوع من الطعام"),ex:["A vaccination is an injection that prevents some diseases such as measles or flu. Farmers also vaccinate chickens and ducks to prevent bird flu.", "Vaccination = injection that PREVENTS disease.", "اللقاح حقنة تمنع بعض الأمراض مثل الحصبة والإنفلونزا. ويلقّح المزارعون الدجاج والبط لمنع إنفلونزا الطيور.", "اللقاح = حقنة تمنع المرض."]});
x("15","K",400,'mcq',"What causes an infectious disease?|ما سبب المرض المعدي؟","Does not know germs cause infection|لا يعرف أن الجراثيم تسبب العدوى",{o:sp("Germs;Cold weather;Too much sleep;Strong bones|الجراثيم;الطقس البارد;النوم الكثير;العظام القوية"),ex:["An infectious disease is caused by very tiny living things called germs. The germs infect the body by getting into it and making us ill.", "Germs → infection → illness.", "المرض المعدي تسببه كائنات حية صغيرة جدًا تسمى الجراثيم. تصيب الجراثيم الجسم بدخولها إليه فتجعلنا مرضى.", "جراثيم ← عدوى ← مرض."]});
x("15","A",475,'mcq',"A farmer gives vaccinations to her chickens and ducks. Why?|تعطي مزارعة لقاحات لدجاجها وبطها. لماذا؟","Thinks only people can have infectious diseases|يظن أن البشر وحدهم يصابون بالأمراض المعدية",{o:sp("To prevent them from getting bird flu;To make them lay bigger eggs;To make them sleep;To make them fly|لتمنع إصابتها بإنفلونزا الطيور;لتبيض بيضًا أكبر;لتنام;لتطير"),ex:["Bird flu is an infectious disease that spreads easily from sick birds to healthy birds, and almost all birds that get it die. Vaccinations prevent birds from getting it.", "Vaccinations protect animals too.", "إنفلونزا الطيور مرض معدٍ ينتقل بسهولة من الطيور المريضة إلى السليمة، وتموت تقريبًا كل الطيور المصابة. واللقاحات تمنع إصابتها.", "اللقاحات تحمي الحيوانات أيضًا."]});
x("15","R",550,'mcq',"Ben says: \"If I take twice as much medicine, I will get better faster.\" Why is he wrong?|يقول بن: «إذا تناولت ضعف جرعة الدواء فسأتحسن أسرع». لماذا هو مخطئ؟","Believes more medicine is always better|يظن أن الدواء الأكثر أفضل دائمًا",{o:sp("Too much medicine can be harmful, so we must follow the instructions;Medicine does not work;Medicine only works for adults;It will make him better even faster|الدواء الزائد قد يضر لذلك يجب اتباع التعليمات;الدواء لا يعمل;الدواء للكبار فقط;سيتحسن أسرع"),ex:["The instructions say how much medicine to take and how often. If you take too much it can be harmful. We should only take medicines given by a doctor, nurse or adult who looks after us.", "Follow the instructions: right amount, right time.", "تبيّن التعليمات كمية الدواء وعدد مرات تناوله. وإذا أخذت كمية زائدة فقد تضرّك. ولا نتناول الأدوية إلا من طبيب أو ممرض أو راشد يرعانا.", "اتبع التعليمات: كمية صحيحة ووقت صحيح."]});
x("21","K",400,'mcq',"What is energy?|ما الطاقة؟","Thinks only living things have energy|يظن أن الكائنات الحية وحدها تملك الطاقة",{o:sp("Anything that can cause movement or carry out an action;A kind of food only;Something we can always see;Something only living things have|أي شيء يمكنه أن يسبب حركة أو ينفذ فعلًا;نوع من الطعام فقط;شيء نراه دائمًا;شيء تملكه الكائنات الحية فقط"),ex:["Energy is anything that can cause movement or carry out an action. It is in living and non-living things, and we can see what it does even if we cannot see the energy itself.", "Energy makes things move or change.", "الطاقة هي أي شيء يمكنه أن يسبب حركة أو ينفذ فعلًا. وهي موجودة في الأحياء والأشياء غير الحية، ونرى ما تفعله وإن لم نرَ الطاقة نفسها.", "الطاقة تجعل الأشياء تتحرك أو تتغير."]});
x("21","K",475,'mcq',"Which of these is a form of energy?|أي مما يلي شكل من أشكال الطاقة؟","Does not know the forms of energy|لا يعرف أشكال الطاقة",{o:sp("Sound;A rock;Wood;Salt|الصوت;صخرة;خشب;ملح"),ex:["Light, heat, sound and movement are forms of energy. A rock, wood and salt are materials, not forms of energy.", "Forms: light, heat, sound, movement.", "الضوء والحرارة والصوت والحركة أشكال من الطاقة. أما الصخرة والخشب والملح فهي مواد وليست أشكالًا للطاقة.", "الأشكال: ضوء، حرارة، صوت، حركة."]});
x("21","A",475,'mcq',"Jamal runs fast at break time. Where did his energy for running come from?|يركض جمال بسرعة وقت الاستراحة. من أين جاءت طاقته للركض؟","Thinks energy comes from shoes or air|يظن أن الطاقة تأتي من الحذاء أو الهواء",{o:sp("The food he ate;The air only;His shoes;The floor|الطعام الذي أكله;الهواء فقط;حذاؤه;الأرض"),ex:["We get our energy from the food we eat. We use it to move, grow, breathe and carry out all our life processes.", "Food gives living things energy.", "نحصل على طاقتنا من الطعام الذي نأكله. نستخدمها لنتحرك وننمو ونتنفس ونؤدي كل عملياتنا الحيوية.", "الطعام يعطي الكائنات الحية الطاقة."]});
x("21","R",550,'mcq',"Arun predicts that a harder flick will make a ping pong ball roll farther. The ball does roll farther. What can he say?|يتوقع أرون أن النقرة الأقوى تجعل كرة التنس تتدحرج أبعد. وفعلًا تدحرجت أبعد. ماذا يستطيع أن يقول؟","Cannot compare a prediction with the result|لا يقارن التوقع بالنتيجة",{o:sp("The result supports his prediction: more energy made the ball move farther;The result does not support his prediction;Energy has nothing to do with it;The ball made its own energy|النتيجة تدعم توقعه: طاقة أكبر جعلت الكرة تتحرك أبعد;النتيجة لا تدعم توقعه;الطاقة لا علاقة لها;الكرة صنعت طاقتها"),ex:["A prediction is what we think will happen. The result matched the prediction, so it supports it. A harder flick gives the ball more energy, so it moves farther.", "Compare the result with the prediction.", "التوقع هو ما نظن أنه سيحدث. وقد طابقت النتيجة التوقع فهي تدعمه. النقرة الأقوى تعطي الكرة طاقة أكبر فتتحرك أبعد.", "قارن النتيجة بالتوقع."]});
x("22","K",400,'mcq',"What is an energy transfer?|ما انتقال الطاقة؟","Thinks energy is used up|يظن أن الطاقة تُستهلك وتختفي",{o:sp("Energy moving from one object to another;Energy being used up;Energy being made;Energy disappearing|انتقال الطاقة من جسم إلى آخر;استهلاك الطاقة;صنع الطاقة;اختفاء الطاقة"),ex:["In an energy transfer, energy moves from one object to another, for example from hot water to a cup. Energy is not used up or lost; it just moves.", "Energy moves. It does not disappear.", "في انتقال الطاقة تنتقل الطاقة من جسم إلى آخر مثل انتقال الحرارة من الماء الساخن إلى الكوب. الطاقة لا تُستهلك ولا تضيع بل تنتقل.", "الطاقة تنتقل ولا تختفي."]});
x("22","A",475,'mcq',"Hot water is poured into a cup and the cup gets hot. What happened to the heat energy of the water?|صُبّ ماء ساخن في كوب فسخن الكوب. ماذا حدث لطاقة حرارة الماء؟","Thinks heat energy disappears|يظن أن طاقة الحرارة تختفي",{o:sp("It moved from the water to the cup;It was used up;It was destroyed;It turned into cold|انتقلت من الماء إلى الكوب;استُهلكت;دُمّرت;تحولت إلى برودة"),ex:["The hot water has heat energy. This heat energy is transferred to the cup and then to the surroundings. The energy chain is: water → cup → surrounding environment.", "Energy chain: water → cup → surroundings.", "الماء الساخن فيه طاقة حرارية. تنتقل هذه الطاقة إلى الكوب ثم إلى المحيط. سلسلة الطاقة: ماء ← كوب ← المحيط.", "سلسلة الطاقة: ماء ← كوب ← المحيط."]});
